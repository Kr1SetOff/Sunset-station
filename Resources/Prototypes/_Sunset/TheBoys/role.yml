# 🌇Sunset🌇 - The Boys gamemode: Butcher's team. Unlike Homelander (who gets a whole new body/
# gear via HomelanderGear), these five keep their existing job and body - see game_rule.yml's
# TheBoys AntagSelection, which layers marker components/tags onto whichever crew member gets
# picked instead of replacing their equipment. Only Butcher gets a real mechanical Objective
# (added in code by TheBoysRuleSystem, see objectives.yml); the other four just get a flavor
# team-briefing message.

# 🌇Sunset🌇 - playtime requirements: curated narrative roles that carry a whole gamemode -
# 20h for the team, 30h for Butcher (the leader with the actual kill objective).
- type: antag
  id: TheBoysButcher
  name: roles-antag-theboys-butcher-name
  antagonist: true
  setPreference: true
  objective: roles-antag-theboys-butcher-objective
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 30h

- type: antag
  id: TheBoysFrenchie
  name: roles-antag-theboys-frenchie-name
  antagonist: true
