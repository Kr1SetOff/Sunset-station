# 🌇Sunset🌇 - gear sets for CrateSyndicateUndetermined (see _Sunset/Uplink/undetermined_crate.yml).
# The 17 "Syndicate*Set" entries below are a full-fidelity port of Goobstation/Reserve-Station's own
# possibleSets list for this crate, including every item in each set - ported items live in
# _Sunset/Uplink/undetermined_gear.yml, _Sunset/Autosurgeon, _Sunset/CustomLawboard,
# _Sunset/Teleporter and _Sunset/Implants. A handful of entries substitute an existing equivalent
# item where the exact upstream one needs a subsystem this fork doesn't have (mind control ->
# reuses this fork's own MindControlImplanter, CQC manual -> reuses this fork's own martial arts
# manual, thermal goggles -> reuses this fork's own functional thermal goggles, etc.) - noted inline.
# SunsetMedicSet and SunsetHotlineMiamiSet are original additions on top, not part of the upstream set.

