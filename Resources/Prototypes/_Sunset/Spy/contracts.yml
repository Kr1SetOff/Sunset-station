# 🌇Sunset🌇 - Spy contract board pool, ported from frostek3122-byte/sunset-station's Bounty
# System. Contracts aren't assigned at round start - the spy accepts them live from a rotating
# board in their uplink (see Content.Server._Sunset.Spy.SpyContracts.SpyContractSystem).
#
# Reward: 0 (default) means "compute from Difficulty" (Easy/Medium/Hard => 25/50/100 SpyCredit,
# scaled further by reputation - see SpyContractSystem.GetReward). Duration: seconds the Spy
# Tracker needs on the target. Radius: hold range for SurveillanceProximity.

# =====================================================================================
# Family 1: crew surveillance (SurveillanceProximity, job-filtered). Plant the tracker on a
# crew member and stay within Radius of them (they can move) for Duration.
# =====================================================================================

- type: spyContract
  id: SpyContractWatchCrew
  contractType: SurveillanceProximity
  difficulty: Easy
  name: spy-contract-watch-crew-name
  description: spy-contract-watch-crew-desc
  duration: 30
  radius: 4
  targetWhitelist:
    components:
    - HumanoidAppearance

- type: spyContract
  id: SpyContractWatchCe
  contractType: SurveillanceProximity
  difficulty: Medium
  name: spy-contract-watch-ce-name
  description: spy-contract-watch-ce-desc
  duration: 45
  radius: 4
  targetWhitelist:
    components:
    - HumanoidAppearance
  targetJobs:
  - ChiefEngineer

- type: spyContract
  id: SpyContractWatchCmo
  contractType: SurveillanceProximity
  difficulty: Medium
