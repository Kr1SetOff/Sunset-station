# 🌇Sunset🌇 - Spy objectives: reuses the existing generic StealCondition/StealTargetGroup and
# EscapeShuttleCondition machinery (same as Thief/Traitor) instead of a bespoke contract system.
# Steal target groups referenced below already exist and are used by Thief/Traitor objectives.

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseSpyObjective
  components:
  - type: Objective
    issuer: objective-issuer-spy
    difficulty: 1
  - type: RoleRequirement
    roles:
    - SpyRole

- type: entity
  abstract: true
  parent: [BaseSpyObjective, BaseStealObjective]
  id: BaseSpyStealObjective
  components:
  - type: StealCondition
    verifyMapExistence: true
    checkStealAreas: true

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealTechnologyDiskObjective
  components:
  - type: StealCondition
    stealGroup: TechnologyDisk

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealNukeDiskObjective
  components:
  - type: StealCondition
    stealGroup: NukeDisk
  - type: Objective
    difficulty: 3

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealCaptainIdObjective
  components:
  - type: StealCondition
    stealGroup: CaptainIDCard
  - type: Objective
    difficulty: 2

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealHandTeleporterObjective
  components:
  - type: StealCondition
    stealGroup: HandTeleporter
  - type: Objective
    difficulty: 2

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealXenoArtifactObjective
  components:
  - type: StealCondition
    stealGroup: XenoArtifact
  - type: Objective
    difficulty: 2

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealForensicScannerObjective
  components:
  - type: StealCondition
    stealGroup: ForensicScanner

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealWantedListObjective
  components:
  - type: StealCondition
    stealGroup: WantedListCartridge

- type: entity
  parent: BaseSpyStealObjective
  id: SpyStealJetpackObjective
  components:
  - type: StealCondition
    stealGroup: JetpackCaptainFilled
  - type: Objective
    difficulty: 2

# Win condition: escape alive via the emergency shuttle with whatever was stolen.
- type: entity
  parent: [BaseSpyObjective, BaseLivingObjective]
  id: SpyEscapeObjective
  name: spy-objective-escape-name
  description: spy-objective-escape-desc
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition
