# 🌇Sunset🌇 - reactions for all Sunset experimental chems. Note the race-transform recipes are
# deliberately non-overlapping (single-additive ones use 3u of their additive) so mixing one race's
# recipe can never accidentally satisfy another's reactant set.

# --- bluespace chain ---

- type: reaction
  id: SunsetBluespaceDistorter
  minTemp: 500
  reactants:
    BluespaceLiquid:
      amount: 5
    Cognizine:
      amount: 2
    UnstableMutagen:
      amount: 2
    Plasma:
      amount: 5
  products:
    BluespaceDistorter: 3

# --- zapalm chain ---

- type: reaction
  id: SunsetPyrosol
  minTemp: 400
  reactants:
    CapsaicinOil:
      amount: 2
    Phosphorus:
      amount: 1
    Plasma:
      amount: 1
  products:
    Pyrosol: 2

- type: reaction
  id: SunsetZapalm
  minTemp: 500
  reactants:
    Napalm:
      amount: 2
    Pyrosol:
      amount: 2
    Iron:
      amount: 1
  products:
    Zapalm: 2

