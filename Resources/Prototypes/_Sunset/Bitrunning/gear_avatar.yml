# --- Domain Loadouts ---

# 🌇Sunset🌇 - MODsuit security gear (ClothingModsuit*) isn't ported in this fork; substituted with
# a hardsuit-equipped security loadout so the MetaCentral domain's forced loadout still works.
- type: startingGear
  parent: BitrunnerAvatarGear
  id: BitrunnerAvatarSecurityOfficerMODGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSec
    head: ClothingHeadHelmetHardsuitSecurity
    outerClothing: ClothingOuterHardsuitSecurity
    gloves: ClothingHandsGlovesFingerless
    shoes: ClothingShoesBootsCombat

# 🌇Sunset🌇 - the Xenonauten tactical gear line isn't ported; substituted with standard combat
