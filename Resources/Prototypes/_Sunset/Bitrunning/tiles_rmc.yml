# 🌇Sunset🌇 - RMC14 Hybrisa tiles used by the original Orion bitrunning domain maps, ported
# with their transitive parent chain (CMTileBase/CMPlanetBase included) so the maps load
# exactly as authored. Textures live at their original /Textures/_RMC14/Tiles/hybrisa paths.
- type: tile
  abstract: true
  id: CMTileBase
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor

- type: tile
  abstract: true
  id: CMPlanetBase
  isSubfloor: true
  deconstructTools: [ ]
  footstepSounds:
    collection: FootstepGrass

- type: tile
  parent: CMPlanetBase
  id: RMCPlanetHybrisaUndergroundWeedable
  name: tiles-rmc-floor
  sprite: /Textures/_RMC14/Tiles/hybrisa/underground.png

