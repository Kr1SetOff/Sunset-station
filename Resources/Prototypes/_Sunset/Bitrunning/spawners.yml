# 🌇Sunset🌇 - Bitrunning domain enemy spawners, ported from Orion-Station-14. Assistants, pirates,
# Death Squad, Xenomorphs (xenomorph_mobs.yml) and the Hierophant (hierophant_mob.yml) all spawn
# real ported mobs with their actual gear/faction/AI/sprites - earlier this fork had these all
# collapsed onto a couple of generic substitute mobs, which is why "greytiders" showed up as
# syndicate footsoldiers and the xenomorph/zealot-arena domains looked unchanged. The Hierophant
# fights via this fork's normal HTN melee AI rather than Lavaland's bespoke "Megafauna" boss-AI
# framework (telegraphed attacks, phases, arena auto-walls) - that framework doesn't exist in this
# fork at all and porting it whole was explicitly descoped. Reindeer spawners point at this fork's
# own equivalent mobs (wrapped with BitrunningDomainEnemyObjectiveComponent so EliminateEnemies
# objectives count their kills). ExperimentalSoldier/Nukeops/SyndicateSoldier are Orion ghost-role
# archetypes with no equivalent in this fork either, so those three still fall back to the
# syndicate footsoldier substitute.

# Objectives

- type: entity
  parent: MarkerBase
  id: BitrunningEncryptedCacheObjectiveSpawner
  name: encrypted cache spawner
  suffix: Bitrunning
  categories: [ Spawner ]
  components:
  - type: Sprite
    layers:
    - state: red
  - type: ConditionalSpawner
    prototypes:
      - EncryptedCacheNode

