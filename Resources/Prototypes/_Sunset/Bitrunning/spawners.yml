# 🌇Sunset🌇 - Bitrunning domain enemy spawners. sunset-station's version (well, Orion's - this is
# straight from Orion-Station-14) parented most of these to spawner/mob prototypes scattered across
# Orion's much larger base (Pirate/DeathSquad/ExperimentalSoldier/NukeopsSoldier ghost-role archetypes,
# a Lavaland Hierophant boss, and Xenomorph/Reindeer "Bitrunning" reskin variants) that don't exist in
# this fork. Rather than chase down that whole cross-referenced roster, these are redefined as
# self-contained spawners pointing at hostile mobs this fork already has: MobSpirate for pirate-themed
# domains, MobSyndicateFootsoldier for the military/soldier-themed ones (DeathSquad, Experimental
# Soldier, Nukeops, Syndicate, and the "Hierophant" boss slot), and the existing MobXeno*/MobReindeer*
# mobs directly (no wrapper variant needed). The core "spawn a hostile, count eliminations toward the
# objective" mechanic is unaffected - only the per-domain cosmetic variety is simplified.

# Objectives

- type: entity
  parent: MarkerBase
  id: BitrunningEncryptedCacheObjectiveSpawner
  name: encrypted cache spawner
  suffix: Bitrunning
  categories: [ Spawner ]
  components:
  - type: Sprite
    layers:
    - state: red
  - type: ConditionalSpawner
    prototypes:
      - EncryptedCacheNode

