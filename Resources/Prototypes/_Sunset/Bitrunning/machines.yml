- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: QuantumServer
  name: quantum server
  description: High density simulation hardware for virtual domains.
  components:
  - type: Sprite
    sprite: _Sunset/Structures/Machines/quantum_server.rsi
    noRot: true
    layers:
    - state: qserver
      map: ["qserver_base"]
    - state: qserver_panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.QuantumServerVisuals.QuantumServerState:
        qserver_base:
          Unpowered: { state: qserver }
          Ready: { state: qserver }
          Cooling: { state: qserver_off }
          Running: { state: qserver_on }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: QuantumServer
  - type: Machine
    board: QuantumServerMachineCircuitboard
  - type: DeviceLinkSource
    ports:
    - BitrunningServerSource
  - type: AutoLinkTransmitter
    channel: BitrunningHub

- type: entity
  parent: BaseComputer
  id: QuantumConsole
  name: quantum console
  description: Console for selecting and controlling bitrunning domains.
  components:
  - type: Sprite
    state: generic
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: bitrunning
    - map: ["computerLayerKeys"]
      state: mining_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ActivatableUI
    key: enum.QuantumConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.QuantumConsoleUiKey.Key:
        type: QuantumConsoleBoundUserInterface
  - type: QuantumConsole
  - type: Computer
    board: QuantumConsoleCircuitboard
  - type: DeviceLinkSink
    ports:
    - BitrunningConsoleSink
  - type: AutoLinkReceiver
    channel: BitrunningHub

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: Netpod
  name: netpod
  description: Neural link pod for bitrunning avatar sessions.
  components:
  - type: Sprite
    sprite: _Sunset/Structures/Machines/netpod.rsi
    noRot: true
    layers:
    - state: netpod
      map: ["base"]
    - state: netpod_panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NetpodVisuals.State:
        base:
          Open: { state: netpod }
          Closed: { state: netpod_closed }
          Active: { state: netpod_closed_active }
          OpenActive: { state: netpod_open_active }
          Opening: { state: netpod_opening }
          Closing: { state: netpod_closing }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: Physics
    canCollide: false
  - type: ContainerContainer
    containers:
      netpod-body:
        !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
      - netpod-body
  - type: DragInsertContainer
    containerId: netpod-body
    entryDelay: 1
  - type: ExitContainerOnMove
    containerId: netpod-body
  - type: NetpodContainer
  - type: ActivatableUI
    key: enum.NetpodUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NetpodUiKey.Key:
        type: NetpodBoundUserInterface
  - type: Machine
    board: NetpodMachineCircuitboard
  - type: DeviceLinkSink
    ports:
    - BitrunningNetpodSink
  - type: AutoLinkReceiver
    channel: BitrunningHub
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SurveillanceCameraEntertainment
    transmitFrequencyId: SurveillanceCamera
  - type: Eye # Fallback
  - type: SurveillanceCamera
    networkSet: true
    nameSet: true
  - type: Netpod
    allowedLoadout:
    - BitrunnerAvatarPassengerGear
    - BitrunnerAvatarClownGear
    - BitrunnerAvatarMimeGear
    - BitrunnerAvatarCaptainGear
    - BitrunnerAvatarEngineerGear
    - BitrunnerAvatarMedicalDoctorGear
    - BitrunnerAvatarScientistGear
    - BitrunnerAvatarSecurityOfficerGear
    - BitrunnerAvatarCargoTechnicianGear
    - BitrunnerAvatarSalvageSpecialistGear
    - BitrunnerAvatarShaftMinerGear

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: Byteforge
  name: byteforge
  description: A quantum processor that recompiles delivered cache crates into physical rewards.
  components:
  - type: Sprite
    sprite: _Sunset/Structures/Machines/byteforge.rsi
    noRot: true
    layers:
    - state: byteforge
      map: ["byteforge_base"]
    - state: on_overlay
      visible: false
      map: ["byteforge_on"]
    - state: on_particles
      visible: false
      drawDepth: Effects
      map: ["byteforge_particles"]
    - state: byteforge_panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ByteforgeVisuals.ByteforgeActive:
        byteforge_on:
          True: { visible: true }
          False: { visible: false }
      enum.ByteforgeVisuals.ByteforgePowered:
        byteforge_particles:
          True: { visible: true }
          False: { visible: false }
      enum.ByteforgeVisuals.ByteforgeAngry:
        byteforge_on:
          True: { state: on_overlay_angry }
          False: { state: on_overlay }
        byteforge_particles:
          True: { state: on_particles_angry }
          False: { state: on_particles }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: Physics
    canCollide: false
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Byteforge
  - type: Machine
    board: ByteforgeMachineCircuitboard
  - type: DeviceLinkSink
    ports:
    - BitrunningByteforgeSink
  - type: AutoLinkReceiver
    channel: BitrunningHub

# ---- Byteforge reward crate ----
# 🌇Sunset🌇 - source only ever referenced this ID as a component default (Content.Shared/_Sunset/Bitrunning/Components/QuantumServerComponent.cs)
# and never actually defined it (an upstream bug); defined here as a plain steel crate reskinned with the
# ported bitrun_secure.rsi art so ByteforgeSystem.TryFillRewardCacheWithLoot has something to spawn and fill.
- type: entity
  parent: CrateGenericSteel
  id: CrateBitrunSecureReward
  name: bitrunning reward crate
  description: A crate of physical rewards recompiled from a delivered bitrunning cache.
  components:
  # 🌇Sunset🌇 - locked to the Bitrun access level: only bitrunners and the quartermaster can
  # open the loot (bitrun_secure.rsi ships proper locked/unlocked states for LockVisuals).
  - type: Lock
    popupMessage: false
    powerNeeded: true
  - type: LockVisuals
  - type: AccessReader
    access: [["Bitrun"]]
  - type: Icon
    sprite: _Sunset/Structures/Storage/Crates/bitrun_secure.rsi
    state: icon
  - type: Sprite
    sprite: _Sunset/Structures/Storage/Crates/bitrun_secure.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded

# ---- Circuit boards ----
- type: entity
  parent: BaseMachineCircuitboard
  id: QuantumServerMachineCircuitboard
  name: quantum server machine board
  description: A machine printed circuit board for a quantum server.
  components:
  - type: Sprite
    state: cpu_science
  - type: MachineBoard
    prototype: QuantumServer
    stackRequirements:
      Manipulator: 4
      Glass: 2
      Cable: 2

- type: entity
  parent: BaseComputerCircuitboard
  id: QuantumConsoleCircuitboard
  name: quantum console board
  description: A computer printed circuit board for a quantum console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: QuantumConsole

- type: entity
  parent: BaseMachineCircuitboard
  id: NetpodMachineCircuitboard
  name: netpod machine board
  description: A machine printed circuit board for a netpod.
  components:
  - type: Sprite
    state: cpu_science
  - type: MachineBoard
    prototype: Netpod
    stackRequirements:
      Manipulator: 4
      Glass: 2
      Cable: 2

- type: entity
  parent: BaseMachineCircuitboard
  id: ByteforgeMachineCircuitboard
  name: byteforge machine board
  description: A machine printed circuit board for a byteforge.
  components:
  - type: Sprite
    state: cpu_science
  - type: MachineBoard
    prototype: Byteforge
    stackRequirements:
      Manipulator: 4
      Glass: 2
      Cable: 2
