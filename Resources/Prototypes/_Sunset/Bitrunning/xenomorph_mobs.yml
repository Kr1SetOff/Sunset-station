  components:
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: SlowOnDamage
    speedModifierThresholds:
      105: 0.7
      125: 0.6
      150: 0.5

- type: entity
  parent: MobXenomorphDroneDungeon
