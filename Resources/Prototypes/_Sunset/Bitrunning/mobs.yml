# ---- Death Squad: elite operatives with a phoron sabre or pulse rifle ----

- type: entity
  parent: BaseMobHuman
  id: BaseMobDeathSquad
  name: Death squad operative
  suffix: AI
  description: Elite special operations operative.
  categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes: [ DeathSquadBaseGear ]
  - type: BitrunningDomainEnemyObjective
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: MobThresholds
    thresholds:
      0: Alive
      190: Critical
      200: Dead

- type: entity
  parent: BaseMobDeathSquad
  id: MobDeathSquadPhoronSabreBitrunning
  suffix: Bitrunning, Energy Sword
  components:
  - type: InnateTool
    tools:
    - id: PhoronSabreOn

- type: entity
  parent: BaseMobDeathSquad
  id: MobDeathSquadPulseRifleBitrunning
  suffix: Bitrunning, Pulse Rifle
  components:
  - type: InnateTool
    tools:
    - id: WeaponPulseRifle

