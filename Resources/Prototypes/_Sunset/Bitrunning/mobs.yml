# 🌇Sunset🌇 - real Orion bitrunning domain mobs, ported faithfully instead of generic
# substitutes. Every mob below matches its Orion counterpart's gear/faction/AI 1:1 (see
# items_deathsquad_pirate.yml for the handful of Goobstation items these needed that this fork
# hadn't ported yet). Assistants use this fork's existing Pirate faction id in place of Orion's
# custom PirateFaction (never actually defined with hostile relations upstream; this one already
# is, and is used for exactly this purpose elsewhere in this fork's salvage content).

# ---- Assistants: grey civilian passengers turned hostile, gas mask + improvised melee weapon ----

- type: entity
  parent: MobCivilian
  id: MobAssistantBat
  name: aggressive assistant
  description: Looks like they are not in the mood to talk.
  components:
  - type: Loadout
    prototypes: [ AssistantBatGear ]
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound

- type: entity
  parent: MobAssistantBat
  id: MobAssistantAxe
  components:
  - type: Loadout
    prototypes: [ AssistantAxeGear ]

- type: entity
  parent: MobAssistantBat
  id: MobAssistantToolbox
  components:
  - type: Loadout
    prototypes: [ AssistantToolboxGear ]

- type: entity
  parent: MobAssistantBat
  id: MobAssistantSpear
  components:
  - type: Loadout
    prototypes: [ AssistantSpearGear ]

- type: entity
  parent: MobAssistantBat
  id: MobAssistantBatBitrunning
  suffix: Bitrunning
  categories: [ HideSpawnMenu ]
  components:
  - type: BitrunningDomainEnemyObjective

- type: entity
  parent: MobAssistantAxe
  id: MobAssistantAxeBitrunning
  suffix: Bitrunning
  categories: [ HideSpawnMenu ]
  components:
  - type: BitrunningDomainEnemyObjective

- type: entity
  parent: MobAssistantToolbox
  id: MobAssistantToolboxBitrunning
  suffix: Bitrunning
  categories: [ HideSpawnMenu ]
  components:
  - type: BitrunningDomainEnemyObjective

- type: entity
  parent: MobAssistantSpear
  id: MobAssistantSpearBitrunning
  suffix: Bitrunning
  categories: [ HideSpawnMenu ]
  components:
  - type: BitrunningDomainEnemyObjective

