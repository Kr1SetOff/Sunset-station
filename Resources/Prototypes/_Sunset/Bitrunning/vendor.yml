# 🌇Sunset🌇 - Bitrunning points vendor, ported from Orion-Station-14 (which built it on DeltaV's
# ShopVendor). All six _Sunset maps already place VendingMachineBitrunning in the bitrunning den -
# this file is what makes that machine real: it sells snacks, gear and (most importantly) the
# domain gear/program/mod disks for the points earned by completing virtual domains.
#
# The whole shop used to render empty: ClothingOuterCoatJacketLeather (below) doesn't exist as a
# prototype in this fork, and the client populates every listing in one loop
# (ShopVendorWindow.Populate -> IPrototypeManager.Index per listing) - one bad id threw partway
# through and the list never got built, balance and all. Fixed to the closest equivalent this fork
# actually has (ClothingOuterCoatBomber) and added a handful of extra survival/combat items to the
# catalog on top of Orion's original list.

