    cost: 325
  - id: MedkitBurnFilled
    cost: 325
  - id: ClothingEyesGlassesSunglasses
    cost: 650
  - id: ClothingOuterCoatBomber
    cost: 650
  - id: ClothingShoesBootsJack
    cost: 650
  - id: BitrunningExtensionPlayerAppearanceDisk
    cost: 100
  - id: BitrunningGearSimpleDisk
    cost: 487
  - id: BitrunningGearComplexDisk
    cost: 812
  - id: BitrunningGearAdvancedDisk
    cost: 1300
  - id: BitrunningProgramBasicDisk
    cost: 487
  - id: BitrunningProgramComplexDisk
    cost: 974
  - id: BitrunningProgramEliteDisk
