# Sunset - Sponsor Uplink catalog. Converted 1:1 from the old sponsor loadout tab
# (Resources/Prototypes/Loadouts/LoadoutGroups/sponsor_loadouts.yml, now removed) - every item that
# used to be a free loadout pick for linked sponsors is now a purchasable uplink listing instead.
# Items restricted to specific jobs now live in that job's department tab instead of a generic slot
# tab (see Content.Server._Sunset.SponsorUplink.SponsorUplinkSystem for the per-player category
# filter - a sponsor only ever sees the general tabs plus their own department's tab).
# Protogen armor frames are excluded - those went back to being a species-gated loadout pick, see
# Resources/Prototypes/Loadouts/LoadoutGroups/sponsor_protogen_loadouts.yml.
# Listing IDs intentionally reuse the old loadout IDs 1:1 for traceability. No name/description
# fields are set - ListingLocalisationHelpers falls back to the underlying entity's own name/desc,
# which is already localized.

