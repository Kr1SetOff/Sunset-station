# Head-only tabs (20+) hold items reusing a department tab's job pool but restricted, on top of
# that, to the one head-of-staff job for that department - e.g. Captain within Command, so a
# HeadOfPersonnel (also Command) doesn't see Captain-exclusive listings. Granted in
# SponsorUplinkSystem alongside (not instead of) the department tab.
- type: storeCategory
  id: SponsorUplinkHeadCommand
  name: store-category-sponsor-uplink-head-command
  priority: 20

