# Sunset - Sponsor Uplink category tabs (mirrors the vanilla Syndicate uplink's tabbed layout,
# just re-themed for cosmetics instead of weapons).
#
# General tabs (0-4) hold items with no job restriction - every sponsor sees these.
# Department tabs (10+) hold items restricted to a specific department's jobs - a sponsor's
# uplink only ever shows their OWN department tab, filtered in SponsorUplinkSystem at spawn.
- type: storeCategory
  id: SponsorUplinkUniforms
  name: store-category-sponsor-uplink-uniforms
  priority: 0

- type: storeCategory
  id: SponsorUplinkOuterwear
  name: store-category-sponsor-uplink-outerwear
  priority: 1

- type: storeCategory
