# Sunset: Felenid - humans with built-in cat ears and a tail. Anatomically identical to
# humans (reuses the Human body/sprites wholesale), sponsor-exclusive, and noticeably smaller.
- type: species
  id: Felenid
  name: species-name-felenid
  roundStart: true
  minSponsorTier: 1
  prototype: MobFelenid
  sprites: MobHumanSprites
  markingLimits: MobFelenidMarkingLimits
  dollPrototype: AppearanceFelenid
  skinColoration: HumanToned
  customName: true
  # DefaultWidth*DefaultHeight drives the actual on-screen X-scale (see HumanoidAppearanceSystem),
  # so Width is kept at 1 and Height carries the ~0.75x shrink to avoid squashing the sprite.
  minWidth: 0.95
  defaultWidth: 1.0
  maxWidth: 1.05
  minHeight: 0.7
  defaultHeight: 0.75
  maxHeight: 0.8

- type: markingPoints
  id: MobFelenidMarkingLimits
  points:
    Special:
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ FelionoidTail ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FelionoidEars ]
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 4
      required: false
    Legs:
      points: 4
      required: false
    Arms:
      points: 4
      required: false
