  desc: reagent-desc-pulmozin
  physicalDesc: reagent-physical-desc-crisp
  flavor: medicine
  color: "#66aaff"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Pulmozin
          max: 25
        damage:
          types:
            Asphyxiation: -6
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Pulmozin
          min: 25
        damage:
          types:
            Asphyxiation: 3

