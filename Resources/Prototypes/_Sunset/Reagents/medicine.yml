# Aggressive chelation agent: purges poisons and radiation fast, but overdo it and it starts
# stripping useful things out of the blood too.
- type: reagent
  id: Toxinol
  name: reagent-name-toxinol
  group: Medicine
  desc: reagent-desc-toxinol
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color: "#7ccc4f"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Toxinol
          max: 25
        damage:
          types:
            Poison: -3
            Radiation: -1.5
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Toxinol
          min: 25
        probability: 0.15
      - !type:ModifyBloodLevel
        conditions:
        - !type:ReagentCondition
          reagent: Toxinol
          min: 25
        amount: -1.5
