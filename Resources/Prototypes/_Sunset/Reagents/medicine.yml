# 🌇Sunset🌇 - experimental medicines. Recipes in _Sunset/Recipes/Reactions/sunset_chemistry.yml,
# all listed in the "Экспериментальная химия" guidebook page.

# Broad-spectrum trauma paste: decent brute+burn healing in one chem, poisons past 30u.
- type: reagent
  id: Mendazin
  name: reagent-name-mendazin
  group: Medicine
  desc: reagent-desc-mendazin
  physicalDesc: reagent-physical-desc-chalky
  flavor: medicine
  color: "#66d18c"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Mendazin
          max: 30
        damage:
          groups:
            Brute: -2
            Burn: -2
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Mendazin
          min: 30
        damage:
          types:
            Poison: 2
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Mendazin
          min: 30
        probability: 0.1

# Synthetic blood substitute: rapidly restores blood volume and slows bleeding.
# Overdose thins the blood instead.
- type: reagent
  id: Hemosynthin
  name: reagent-name-hemosynthin
  group: Medicine
  desc: reagent-desc-hemosynthin
  physicalDesc: reagent-physical-desc-cloudy
  flavor: medicine
  color: "#bb2222"
  metabolisms:
    Medicine:
      effects:
      - !type:ModifyBloodLevel
        conditions:
        - !type:ReagentCondition
          reagent: Hemosynthin
          max: 25
        amount: 3
      - !type:ModifyBleed
        conditions:
        - !type:ReagentCondition
          reagent: Hemosynthin
          max: 25
        amount: -1
      - !type:ModifyBleed
        conditions:
        - !type:ReagentCondition
          reagent: Hemosynthin
          min: 25
        amount: 1
      - !type:ModifyBloodLevel
        conditions:
        - !type:ReagentCondition
          reagent: Hemosynthin
          min: 25
        amount: -2

