# 🌇Sunset🌇 - the Darwinium family: hold 15u+ in your body and you're permanently rebuilt into
# the matching species (works on monkeys/kobolds too - the classic "uplift the lab monkey" chem).
# Every non-human variant is brewed FROM Darwinium plus something associated with that race.
# Polymorph configs in Resources/Prototypes/_Sunset/Polymorphs/race_polymorphs.yml.

- type: reagent
  id: Darwinium
  name: reagent-name-darwinium
  group: Special
  desc: reagent-desc-darwinium
  physicalDesc: reagent-physical-desc-chalky
  flavor: medicine
  color: "#c17736"
  metabolisms:
    Poison:
      effects:
      - !type:Polymorph
        prototype: SunsetRacePolymorphHuman
        conditions:
        - !type:ReagentCondition
          reagent: Darwinium
          min: 15
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Darwinium
          min: 30
        damage:
          types:
            Poison: 3
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Darwinium
          min: 30
        probability: 0.15

