# 🌇Sunset🌇 - unique/experimental chems: bluespace chain, zapalm chain, and the Darwinium
# race-transformation family. Recipes in Resources/Prototypes/_Sunset/Recipes/Reactions/,
# custom effects in Content.Shared/_Sunset/Chemistry (SunsetChemistryEffects.cs).

# Ground from a bluespace anomaly core. Every metabolized tick has a good chance to fling
# you to a random spot on the station.
- type: reagent
  id: BluespaceLiquid
  name: reagent-name-bluespace-liquid
  group: Special
  desc: reagent-desc-bluespace-liquid
  physicalDesc: reagent-physical-desc-bubbling
  flavor: medicine
  color: "#00ccff"
  metabolisms:
    Poison:
      effects:
      - !type:SunsetRandomTeleport
        probability: 0.35
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: BluespaceLiquid
          min: 20
        damage:
          types:
            Poison: 2
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: BluespaceLiquid
          min: 20
        probability: 0.1

# The prototype bluespace distorter: hold 15u+ in your body and your matter stops being
# entirely real - you walk straight through walls for 15 minutes. Overdose unravels your cells.
- type: reagent
  id: BluespaceDistorter
  name: reagent-name-bluespace-distorter
  group: Special
  desc: reagent-desc-bluespace-distorter
  physicalDesc: reagent-physical-desc-cloudy
  flavor: medicine
  color: "#4d79ff"
  metabolisms:
    Poison:
      effects:
      - !type:SunsetBluespacePhase
        durationSeconds: 900
        conditions:
        - !type:ReagentCondition
          reagent: BluespaceDistorter
          min: 15
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: BluespaceDistorter
          min: 25
        damage:
          types:
            Cellular: 2

# Zapalm's volatile intermediate - burns going down, useful for nothing except making zapalm.
- type: reagent
  id: Pyrosol
  name: reagent-name-pyrosol
  group: Pyrotechnic
  desc: reagent-desc-pyrosol
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color: "#ff6a00"
  metabolisms:
    Poison:
      effects:
      - !type:AdjustTemperature
        amount: 5000
      - !type:HealthChange
        damage:
          types:
            Heat: 0.5

# Zapalm: hold 15u+ and become a walking star of fire for 15 minutes - everything flammable
# within two tiles in each cardinal direction ignites, and you slow-roast yourself too
# (~50 burn over the full duration). Extremely hard to purge.
- type: reagent
  id: Zapalm
  name: reagent-name-zapalm
  group: Pyrotechnic
  desc: reagent-desc-zapalm
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color: "#d61a1a"
  metabolisms:
    Poison:
      effects:
      - !type:SunsetZapalmAura
        durationSeconds: 900
        conditions:
        - !type:ReagentCondition
          reagent: Zapalm
          min: 15
      - !type:AdjustTemperature
        amount: 4000
      - !type:Ignite
        conditions:
        - !type:ReagentCondition
          reagent: Zapalm
          min: 25
