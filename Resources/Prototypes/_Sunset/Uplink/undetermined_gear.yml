# Working implants - parented from BaseSubdermalImplant (the real subdermal-implant system that
# Implanter/TriggerOnActivateImplant actually hook into), not Starlight's separate organ-slot
# BaseImplant, which was the bug that made these do nothing on the previous pass.

- type: entity
  parent: BaseSubdermalImplant
  id: NutrimentImplant
  name: nutriment pump implant
  description: This implant floods the user's body with synthesized nutriment when activated, curing hunger.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateNutrimentImplant
  - type: TriggerOnActivateImplant
  - type: SatiateHungerOnTrigger
    targetUser: true
    hungerAmount: 60

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: NutrimentImplanter
  suffix: Nutriment Pump
  components:
  - type: Implanter
    implant: NutrimentImplant

- type: entity
  parent: BaseSubdermalImplant
  id: SmokeImplant
  name: smoke implant
  description: This implant releases a cloud of smoke around the user when activated.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateSmokeImplant
  - type: TriggerOnActivateImplant
  - type: SmokeOnTrigger
    targetUser: true
    spreadAmount: 20
    duration: 15

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: SmokeImplanter
  suffix: Smoke
  components:
  - type: Implanter
    implant: SmokeImplant

- type: entity
  parent: BaseSubdermalImplant
  id: BinaryImplant
  name: binary decoder implant
  description: This implant grants the user access to the Binary radio channel without a headset.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - Binary

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: BinaryImplanter
  suffix: Binary Decoder
  components:
  - type: Implanter
    implant: BinaryImplant
