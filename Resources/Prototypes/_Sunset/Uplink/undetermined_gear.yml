    sprite: _Goobstation/Clothing/OuterClothing/Coats/david_jacket.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Coats/david_jacket.rsi

- type: entity
  parent: [ ClothingOuterDavidsJacket, BaseMajorContraband ]
  id: ClothingOuterDavidsJacketValid
  name: edgerunner jacket
  description: You're right on the edge. Show 'em you got this.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
  - type: ModifyDelayedKnockdown
    delayDelta: 1.5
    knockdownTimeDelta: -1.5
  - type: StaminaResistance
    damageCoefficient: 0.7

- type: entity
  id: ContractorBaton
  parent: [ Stunbaton, BaseSyndicateContraband ]
  name: contractor baton
  description: A compact, specialised baton assigned to Syndicate contractors. Applies light electrical shocks to targets.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
    layers:
    - state: icon-off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
    heldPrefix: off
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
    slots:
    - Belt
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: icon }
          False: { state: icon-off }
  - type: StaminaDamageOnHit
    damage: 85
  - type: StunBorgsOnHit
  - type: TogglePreventStaminaDamage

- type: entity
  parent: [ ClothingOuterBaseMedium, ClothingOuterStorageToggleableBase, AllowSuitStorageClothing, BaseSyndicateContraband ]
  id: ClothingOuterArmorCloakSith
  name: dark lord cloak
  description: What began as a simple cosplay cloak was illegally reinforced with armored plates, transforming it into a functional piece of armor. Looks like it's even capable of protecting the user from the lack of pressure in space.
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/Clothing/OuterClothing/void_cloak.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Clothing
    sprite: _Goobstation/Heretic/Clothing/OuterClothing/void_cloak.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: PressureProtection
    lowPressureMultiplier: 1000

