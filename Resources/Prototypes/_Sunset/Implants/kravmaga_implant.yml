# 🌇Sunset🌇 - KravMagaImplanter (from the Goobstation Implants set): grants the actual Krav Maga
# style ported from mini-station-goob (Leg Sweep / Neck Chop / Lung Punch primed strikes) - see
# SharedMartialArtsSystem.KravMaga.cs.

- type: entity
  parent: BaseSubdermalImplant
  id: KravMagaImplant
  name: krav maga implant
  description: This implant teaches the user close-quarters combat techniques the instant it's installed.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: MartialArtImplant
    style: KravMaga

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: KravMagaImplanter
  suffix: Krav Maga
  components:
  - type: Implanter
    implant: KravMagaImplant
