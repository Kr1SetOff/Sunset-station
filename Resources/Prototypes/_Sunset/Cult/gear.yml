# 🌇Sunset🌇 - Cult of Nar'Sie starting gear and the summoning rune structure (internal ids still say
# "Ratvar" - see the TODO note in Content.Server._Sunset.Cult.RatvarCultSystem). Cultists keep their
# normal crew job clothes (undercover among the crew, like Traitor/Revolutionary) - only pocket1 is
# touched, so nothing here clobbers their job's jumpsuit/head/outerClothing. The head cultist
# additionally gets the classic cult vestments (already in the base game, ported from tgstation) stashed
# in their backpack (not force-equipped, so they stay undercover until they choose to put them on).

- type: startingGear
  id: RatvarCultistGear
  equipment:
    pocket1: RatvarCultDagger

- type: startingGear
  id: RatvarCultLeaderGear
  parent: RatvarCultistGear
  storage:
    back:
    - ClothingHeadHelmetCult
    - ClothingOuterArmorCult
    - BedsheetCult

# The cult's ritual focus - activating it in-hand opens a radial "ritual wheel"
# (Content.Client._Sunset.Cult.RatvarCultDaggerBoundUserInterface) listing whichever rituals the
# wielder currently holds (see actions.yml). A separate prototype from the base RitualDagger (which
# stays a plain flavor item usable elsewhere, e.g. random cargo deliveries) so only this one opens the
# cult UI.
- type: entity
  parent: RitualDagger
  id: RatvarCultDagger
  name: ritual dagger
  suffix: Nar'Sie Cult
  components:
  # QuickEquip intercepts UseInHand and sheathes the dagger on your back instead - since this dagger's
  # whole point is opening the ritual wheel on use, that shortcut has to go (it can still be worn by
  # manually dragging it onto the back slot).
  - type: Clothing
    quickEquip: false
  - type: ActivatableUI
    key: enum.RatvarCultDaggerUiKey.Key
    inHandsOnly: true
    singleUser: true
    verbText: ratvar-cult-dagger-open-verb
  - type: UserInterface
    interfaces:
      enum.RatvarCultDaggerUiKey.Key: { type: RatvarCultDaggerBoundUserInterface }

- type: entity
  parent: BaseRune
  id: RatvarSummonRune
  name: руна возвращения Нар'Си
  description: Начертанные символы расходятся кругами от центра. Кажется, она ждёт достаточно рук.
  components:
  - type: Sprite
    layers:
    - state: cult7
      color: "#8b0000"
  - type: RatvarSummonRune

# Rite of Offering - porting tgstation's /obj/effect/rune/convert (runes.dm): does nothing until an
# incapacitated non-cultist lies on it and at least 2 cultists invoke it together.
- type: entity
  parent: BaseRune
  id: RatvarConvertRune
  name: руна подношения
  description: Спиралевидные символы, начерченные для подношения неверных Нар'Си.
  components:
  - type: Sprite
    layers:
    - state: cult4
      color: "#8b0000"
  - type: RatvarConvertRune

# Barrier rune - porting tgstation's /obj/effect/rune/wall (runes.dm): toggles a temporary wall on the
# tile above it. Solo-invokable, no cultist-count requirement (matches tg).
- type: entity
  parent: BaseRune
  id: RatvarWallRune
  name: руна барьера
  description: Угловатые символы, готовые обрушить непроходимую стену на незваных гостей.
  components:
  - type: Sprite
    layers:
    - state: cult3
      color: "#8b0000"
  - type: RatvarWallRune

# The wall the Barrier rune spawns/despawns. Reuses the wizard's WallForce structure (same
# collision/airtight setup, see Resources/Prototypes/Entities/Structures/Walls/walls.yml) but without
# TimedDespawn, since this one is meant to be toggled by hand instead of expiring on a timer.
- type: entity
  id: RatvarCultBarrier
  name: blood-red barrier
  components:
  - type: Tag
    tags:
    - Wall
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - SpecialWallLayer
        layer:
        - SpecialWallLayer
  - type: Airtight
  - type: Sprite
    sprite: Structures/Magic/forcewall.rsi
    state: forcewall
    color: "#8b0000"
  - type: Icon
    sprite: Structures/Magic/forcewall.rsi
    state: forcewall

# Rite of Boiling Blood - porting tgstation's /obj/effect/rune/blood_boil (runes.dm): requires 3
# cultists nearby to invoke, then burns every non-cultist who can see it.
- type: entity
  parent: BaseRune
  id: RatvarBloodBoilRune
  name: руна кипящей крови
  description: Раскалённые докрасна символы. Кажется, она вот-вот вспыхнет.
  components:
  - type: Sprite
    layers:
    - state: cult5
      color: "#8b0000"
  - type: RatvarBloodBoilRune

# Teleport rune - porting tgstation's /obj/effect/rune/teleport (runes.dm): warps everything above it
# to the nearest other linked teleport rune.
- type: entity
  parent: BaseRune
  id: RatvarTeleportRune
  name: руна телепортации
  description: Символы, свёрнутые в спираль, указывающую куда-то очень далеко.
  components:
  - type: Sprite
    layers:
    - state: cult6
      color: "#8b0000"
  - type: RatvarTeleportRune

# Raise Dead rune - porting tgstation's /obj/effect/rune/raise_dead (runes.dm): revives a dead cultist
# lying on it, spending banked sacrifices (see RatvarCultRuleComponent).
- type: entity
  parent: BaseRune
  id: RatvarRaiseDeadRune
  name: руна воскрешения
  description: Символы, обвивающие друг друга в форме бесконечного цикла - жизни, смерти и снова жизни.
  components:
  - type: Sprite
    layers:
    - state: cult1
      color: "#8b0000"
  - type: RatvarRaiseDeadRune

# Apocalypse rune - porting tgstation's /obj/effect/rune/apocalypse (runes.dm): a last-resort rite that
# paralyzes the area and unleashes station-wide chaos.
- type: entity
  parent: BaseRune
  id: RatvarApocalypseRune
  name: руна апокалипсиса
  description: Хаотично сплетённые шестерни, испускающие тёмный жар. Взгляд на неё внушает первобытный ужас.
  components:
  - type: Sprite
    layers:
    - state: cult2
      color: "#8b0000"
  - type: RatvarApocalypseRune

# The brass clockwork vestments moved to Resources/Prototypes/_Sunset/Ratvar/gear.yml, now that the
# actual "Servants of Ratvar" antagonist exists as its own system - see that file instead.
