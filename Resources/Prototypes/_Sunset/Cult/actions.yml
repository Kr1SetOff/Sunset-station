# 🌇Sunset🌇 - Ratvar cultist rituals. Not shown on the hotbar (autoPopulate: false) - instead these are
# granted directly to the cultist's mind via ActionGrant (see roundstart.yml) but only reachable by
# activating the Ritual Dagger (RatvarCultDagger, see items.yml), which opens a radial ritual wheel
# (Content.Client._Sunset.Cult.RatvarCultDaggerBoundUserInterface) listing whichever of these actions
# the wielder currently holds - so losing the dagger means losing access to the rites, matching classic
# SS13 cult (the dagger/tome is the ritual focus, not a personal power). Selecting a wheel entry just
# arms that action's normal targeting mode (Content.Client...ActionUIController.ActivateAction), so the
# DoAfter/event handlers in Content.Server._Sunset.Cult.RatvarCultSystem are unchanged.

- type: entity
  parent: BaseAction
  id: ActionRatvarCultConvert
  name: Начертить руну подношения
  description: Начертить руну обряда подношения. Уложите недееспособную жертву на руну и призовите ещё одного культиста, чтобы провести обряд - как "Rite of Offering" в оригинальном культе Нар'Си.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 3
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: cult_mark
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultConvertActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultCommune
  name: Слово культа
  description: Обратиться ко всем культистам Ратвара, где бы они ни были.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 2
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: cult_comms
  - type: InstantAction
    event: !type:RatvarCultCommuneActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultScribeSummon
  name: Начертить руну возвращения
  description: Начертить на полу руну для ритуала призыва Ратвара.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: telerune
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultScribeSummonActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultScribeWall
  name: Начертить руну барьера
  description: Начертить руну, создающую временный барьер при активации. Активируйте руну ещё раз, чтобы его убрать.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: cultforcewall
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultScribeWallActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultScribeBloodBoil
  name: Начертить руну кипящей крови
  description: Начертить руну, которая обжигает кровь всех неверных поблизости. Требует не менее 3 культистов рядом для активации.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: cultfist
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultScribeBloodBoilActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultScribeTeleport
  name: Начертить руну телепортации
  description: Начертить руну, которая переносит всё, что на ней стоит, к ближайшей другой руне телепортации.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: tele
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultScribeTeleportActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultScribeRaiseDead
  name: Начертить руну воскрешения
  description: Начертить руну, способную оживить мёртвого культиста, если у культа накоплено достаточно жертв Ратвару.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: revive
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultScribeRaiseDeadActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultScribeApocalypse
  name: Начертить руну апокалипсиса
  description: Последнее средство - парализует всех поблизости и обрушивает на станцию хаос. Требует не менее 3 культистов рядом для активации.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: horror
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarCultScribeApocalypseActionEvent

# Blood Magic - porting tgstation's /datum/action/innate/cult/blood_magic (blood_magic.dm). Unlike the
# rune rites above, this doesn't need the dagger - it's the cultist's own innate mark, so it's a normal
# always-visible hotbar action (autoPopulate not disabled).

- type: entity
  parent: BaseAction
  id: ActionRatvarCultPrepareBloodMagic
  name: Приготовить кровавую магию
  description: Вырезать на своей плоти неестественные символы, пробуждая кровавую магию. Даёт стартовый набор из трёх заклинаний с ограниченным числом применений. Можно использовать лишь раз.
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: carve
  - type: InstantAction
    event: !type:RatvarCultPrepareBloodMagicActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultBloodStun
  name: Кровавая магия - Оглушение
  description: Наделяет твою руку силой оглушить и заглушить жертву прикосновением.
  components:
  - type: LimitedCharges
    maxCharges: 3
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: hand
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:RatvarCultBloodStunActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultBloodEmp
  name: Кровавая магия - ЭМИ
  description: Испускает из твоей руки мощный электромагнитный импульс.
  components:
  - type: LimitedCharges
    maxCharges: 2
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: emp
  - type: InstantAction
    event: !type:RatvarCultBloodEmpActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarCultBloodDagger
  name: Кровавая магия - Призыв кинжала
  description: Призывает запасной ритуальный кинжал, если твой был утерян или украден.
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Interface/Actions/ratvar_cult_actions.rsi
      state: dagger
  - type: InstantAction
    event: !type:RatvarCultBloodDaggerActionEvent
