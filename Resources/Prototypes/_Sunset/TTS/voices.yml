# 🌇Sunset🌇 - character TTS voices (Russian), served by the standalone TTS worker
# (D:\github govna\TTS on the host; see its README). The `voice:` index maps to an entry in the
# worker's voices.json - indices 3000+ are reserved for Sunset so they never collide with the
# Starlight voice set (which tops out around 1023, with 2001 used for announcements).
#
# Only characters with an actual RVC model installed on the worker are listed here - showing a
# named character that just falls back to a generic Silero voice would be misleading, so add the
# prototype only after wiring the model into voices.json (see that file's own comment).

- type: voice
  id: sunsetKratos
  voice: 3003
  name: tts-voice-name-sunset-kratos
  sex: Male
  silicon: false
  copyright: "Character voice likeness: Kratos (God of War, RU VO)"

