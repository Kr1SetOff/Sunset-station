# 🌇Sunset🌇 - 20 character TTS voices (Russian), served by the standalone TTS worker
# (D:\github govna\TTS on the host; see its README). The `voice:` index maps to an entry in the
# worker's voices.json - indices 3000+ are reserved for Sunset so they never collide with the
# Starlight voice set (which tops out around 1023, with 2001 used for announcements).
#
# Character likeness voices are produced via RVC models the server owner installs on the worker;
# until a model is installed, the worker falls back to the configured base Silero speaker.

# ── Мужские (3000-3004) ─────────────────────────────────────────────────────

- type: voice
  id: sunsetGeralt
  voice: 3000
  name: tts-voice-name-sunset-geralt
  sex: Male
  silicon: false
  copyright: "Character voice likeness: Geralt (The Witcher 3, RU VO)"

