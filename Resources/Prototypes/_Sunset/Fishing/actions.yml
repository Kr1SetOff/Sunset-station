# 🌇Sunset🌇 - ported from Goobstation's fishing minigame (via Orion-Station-14).
- type: entity
  parent: BaseAction
  id: ActionStartFishing
  name: Throw fishing lure
  description: Throw lure from the fishing rod to catch something!
  components:
  - type: Action
    icon:
      sprite: _Sunset/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
    sound:
      path: /Audio/_Sunset/Fishing/fishing_rod_cast.ogg
    itemIconStyle: BigAction
    useDelay: 2.5
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ThrowFishingLureActionEvent

- type: entity
  parent: BaseAction
  id: ActionStopFishing
  name: Reel fishing rod
  description: Reel your fishing rod to pull an object that it attached to, or stop fishing.
  components:
  - type: Action
    icon:
      sprite: _Sunset/Objects/Specific/Fishing/fishing_rod.rsi
      state: icon
    sound:
      path: /Audio/_Sunset/Fishing/fishing_rod_reel.ogg
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:PullFishingLureActionEvent
