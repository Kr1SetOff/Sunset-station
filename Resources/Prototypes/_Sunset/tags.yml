# The Boys gamemode - marks which of Butcher's team a player is. Butcher/Hughie/Kimiko's tags are
# also used by CompoundV's chemical effect (Resources/Prototypes/_Sunset/TheBoys/reagents.yml) to
# gate "drinking V grants YOUR character's specific power" per-drinker via EntityEffect
# TagConditions - Frenchie and Mother's Milk never had V-derived powers in the show, so their tags
# aren't part of that gate and they just fall through to the same poison everyone outside the team
# gets. Mother's Milk's tag is still needed though, purely to identify him at role-selection time
# for his canon-specific gear (see TheBoysRuleSystem.OnMemberSelected).
- type: Tag
  id: TheBoysButcher

- type: Tag
  id: TheBoysHughie

- type: Tag
  id: TheBoysMothersMilk

- type: Tag
  id: TheBoysKimiko
