# 🌇Sunset🌇 - animated emotes: the chat trigger fires a normal emote, the server stamps it onto
# AnimatedEmotesComponent (Content.Server/_Sunset/Emotes), and clients play a sprite animation
# (Content.Client/_Sunset/Emotes). Granted to all playable species via BaseMobSpecies.
- type: emote
  id: SunsetEmoteJump
  name: chat-emote-name-sunset-jump
  chatMessages: ["chat-emote-msg-sunset-jump"]
  whitelist:
    components:
    - AnimatedEmotes
  chatTriggers:
  - прыгает
  - подпрыгивает
  - прыгает.
  - подпрыгивает.

- type: emote
  id: SunsetEmoteSpin
  name: chat-emote-name-sunset-spin
  chatMessages: ["chat-emote-msg-sunset-spin"]
  whitelist:
    components:
    - AnimatedEmotes
  chatTriggers:
  - кружится
  - крутится
  - кружится.
  - крутится.

