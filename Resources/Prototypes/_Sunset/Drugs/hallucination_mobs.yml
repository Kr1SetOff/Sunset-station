# 🌇Sunset🌇 - purely visual "illusion" entities spawned client-side-only by
# Content.Client.Drugs.HallucinationMobSystem while a drug's hallucination effect is active - see
# Content.Shared.Drugs.HallucinationMobsComponent/AddHallucinationTheme. Never spawned for real, never
# networked, never touch the server at all. No Physics/Damageable/etc - just a sprite that gets moved
# around directly by the client system, reusing existing mob art instead of commissioning new sprites.

- type: entity
  id: BaseHallucinationMob
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false

- type: entity
  parent: BaseHallucinationMob
  id: HallucinationMobMeth
  name: паранойя
  description: Тебе показалось.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Xenos/runner.rsi
    state: running

