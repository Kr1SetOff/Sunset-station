# Genetic mutations for the genetics system. Each lives in a unique structural-enzyme (SE) block and
# expresses itself once that block reaches the tier threshold.
#
# 🌇Sunset🌇 - four of sunset-station's mutations were dropped rather than ported: GeneVoidLungs
# (PressureImmunity/BreathingImmunity components), GeneXrayEyes (UltraVision), GeneHulk (Hulk, a whole
# separate subsystem) and GeneDeafness (Deaf) all depend on components/systems that don't exist in
# this fork. Everything else ports over using components this fork already has.

# ---- Powers ----

- type: mutation
  id: GeneNightEyes
  name: mutation-night-eyes-name
  description: mutation-night-eyes-desc
  block: 12
  tier: Intermediate
  instability: 10
  components:
  - type: NightVision

