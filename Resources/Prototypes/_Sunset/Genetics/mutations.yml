# Genetic mutations for the genetics system. Each lives in a structural-enzyme (SE) block and
# expresses itself once that block reaches the tier threshold. Which block holds which gene is
# shuffled every round (Paradise SS13 style, see GeneticsSystem.EnsureGeneLayout) - that's why no
# mutation declares a block here.
#
# 🌇Sunset🌇 - two of sunset-station's mutations were dropped rather than ported: GeneVoidLungs
# (PressureImmunity/BreathingImmunity components) and GeneXrayEyes (UltraVision) depend on
# components/systems that don't exist in this fork. GeneHulk and GeneDeafness were originally dropped
# for the same reason, but have since been ported below with dedicated components (see the "further
# batch" note). Everything else ports over using components this fork already has.
#
# 🌇Sunset🌇 - three mutations from Paradise Station's actual current gene pool
# (code/game/dna/mutations/mutation_powers.dm) added on top of the above: GeneFireResistance (mirrors
# Paradise's heat_resist, the counterpart to our existing cold-only GeneCryokinesis - needed a new
# HeatOnly flag on GeneThermalComponent/GeneThermalSystem since only ColdOnly existed before),
# GeneChameleonSkin (mirrors stealth/chameleon, simplified to a flat visibility reduction via the
# existing StealthComponent rather than tile-matching camouflage) and GeneMindShield (mirrors
# psychic_resist, reusing the existing MindShieldComponent for conversion/mind-control resistance).
#
# 🌇Sunset🌇 - a further batch of genes ported below: GeneHulk (bonus melee damage + a blocked glove
# slot), GeneBlink (short-range teleport action), GeneCoughing/GeneSneezing/GeneHiccuping (auto-emote
# disease genes, each with its own marker component so several can stack without one gene's activation
# clobbering another's AutoEmoteComponent), GeneStutter/GeneNarcolepsy (reuse the existing
# StutteringAccent/Narcolepsy components), GeneNearsightedness (a lighter PermanentBlindness cousin
# that blurs rather than blinds via a partial BlindableComponent.MinDamage, kept as its own component
# so it can stack with GeneBlindness), GeneBaldness (strips hair/facial-hair markings, restored on
# deactivation) and GeneChunkyFingers (strips ComplexInteraction, blocking fine manipulation).

# ---- Powers ----

