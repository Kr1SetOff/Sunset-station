- type: mutation
  id: GeneRegeneration
  name: mutation-regeneration-name
  description: mutation-regeneration-desc
  tier: Major
  instability: 15
  components:
  # Strong, always-on regeneration. damageCap 0 means it keeps healing no matter how hurt the carrier is.
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damageCap: 0
    damage:
      groups:
        Brute: -2
        Burn: -2
        Airloss: -2
        Toxin: -1

