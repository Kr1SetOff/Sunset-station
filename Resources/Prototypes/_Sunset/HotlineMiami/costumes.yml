# 🌇Sunset🌇 - Hotline Miami 2 animal-mask costume sets, built from locally-supplied sprite sheets.
# Each set is a mask (all four) plus whichever of gloves/jacket/tank-top the source art actually
# included per animal - not every animal has every slot. Armor values are cosmetic-tier by design
# (these are gang costumes, not real protective gear).

# --- Swan (brother and sister sharing one costume set: two masks, two jackets, two pairs of
# gloves, two tank tops - bundled together as a single crate/set per the source art's naming) ---

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskHotlineSwan
  name: swan mask (brother)
  description: A cracked plastic swan mask. Something about it feels final.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan.rsi
  - type: Item
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan.rsi

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskHotlineSwan2
  name: swan mask (sister)
  description: Her mask. Same cracked plastic, same finality.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan2.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan2.rsi
  - type: Item
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan2.rsi

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterHotlineSwan
  name: swan gang jacket (brother)
  description: A worn jacket favored by the swan-masked crew.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan.rsi
  - type: Item
    size: Normal
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterHotlineSwan2
  name: swan gang jacket (sister)
  description: Her jacket. Just as worn.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan2.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan2.rsi
  - type: Item
    size: Normal
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan2.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsHotlineSwan
  name: swan gang gloves (brother)
  description: Plain gloves, worn thin at the knuckles.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Hands/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Hands/HotlineMiami/swan.rsi
  - type: Item
    sprite: _Sunset/Clothing/Hands/HotlineMiami/swan.rsi

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsHotlineSwan2
  name: swan gang gloves (sister)
  description: Her gloves. Just as plain.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Hands/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Hands/HotlineMiami/swan.rsi
  - type: Item
    sprite: _Sunset/Clothing/Hands/HotlineMiami/swan.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformHotlineSwan
  name: swan gang tank top (brother)
  description: A plain tank top worn under the jacket.
  components:
