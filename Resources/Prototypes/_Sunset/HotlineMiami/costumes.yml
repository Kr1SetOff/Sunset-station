# --- Tiger (mask + tank top + brass knuckles) ---

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskHotlineTiger
  name: tiger mask
  description: A snarling tiger mask with sharp orange stripes.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Mask/HotlineMiami/tiger.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Mask/HotlineMiami/tiger.rsi
  - type: Item
    sprite: _Sunset/Clothing/Mask/HotlineMiami/tiger.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformHotlineTiger
  name: tiger gang tank top
  description: A plain black tank top.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/tiger.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/tiger.rsi
  - type: Item
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/tiger.rsi

- type: entity
  parent: BaseItem
  id: WeaponHotlineTigerKastet
  name: tiger's knuckles
  description: A battered set of brass knuckles. They've clearly been used before.
  components:
  - type: Sprite
    sprite: _Sunset/Objects/Weapons/Melee/HotlineMiami/tiger_kastet.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _Sunset/Objects/Weapons/Melee/HotlineMiami/tiger_kastet.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4
  - type: DisarmMalus
