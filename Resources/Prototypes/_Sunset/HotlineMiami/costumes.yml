    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/swan.rsi
  - type: Item
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/swan.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformHotlineSwan2
  name: swan gang tank top (sister)
  description: Her tank top, just as plain.
  components:
  - type: Sprite
