# --- Tiger (mask + tank top + brass knuckles) ---

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskHotlineTiger
  name: tiger mask
  description: A snarling tiger mask with sharp orange stripes.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Mask/HotlineMiami/tiger.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Mask/HotlineMiami/tiger.rsi
  - type: Item
    sprite: _Sunset/Clothing/Mask/HotlineMiami/tiger.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformHotlineTiger
  name: tiger gang tank top
  description: A plain black tank top.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/tiger.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/tiger.rsi
  - type: Item
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/tiger.rsi

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsHotlineTigerKastet
  name: tiger's knuckles
  description: A battered set of brass knuckles, worn like gloves. A light punch is just a punch - but throw your whole weight behind it and it becomes a wide, bone-breaking hook.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Hands/HotlineMiami/tiger.rsi
    state: icon
  - type: Clothing
    sprite: _Sunset/Clothing/Hands/HotlineMiami/tiger.rsi
  - type: Item
    size: Small
    sprite: _Sunset/Clothing/Hands/HotlineMiami/tiger.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: -135
    # Base damage is the full heavy/wide-attack hit; ClickDamageModifier scales it down for the
    # single-target light attack. Must be worn (not just held) to count as the wielder's weapon -
    # see MeleeWeaponComponent.MustBeEquippedToUse and SharedMeleeWeaponSystem.TryGetWeapon's gloves
    # fallback. Once the gloves (not the player's own body) resolve as the weapon, the client's RMB
    # handling skips the AltDisarm shove and performs a heavy/wide swing instead - no code needed.
    damage:
      types:
        Piercing: 35
    clickDamageModifier: 0.3
    mustBeEquippedToUse: true
    soundHit:
      collection: MetalThud
