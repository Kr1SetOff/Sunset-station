# 🌇Sunset🌇 - Hotline Miami 2 animal-mask costume sets, built from locally-supplied sprite sheets.
# Each set is a mask (all four) plus whichever of gloves/jacket/tank-top the source art actually
# included per animal - not every animal has every slot. Armor values are cosmetic-tier by design
# (these are gang costumes, not real protective gear).

# --- Swan (mask + jacket) ---

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskHotlineSwan
  name: swan mask
  description: A cracked plastic swan mask. Something about it feels final.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan.rsi
  - type: Item
    sprite: _Sunset/Clothing/Mask/HotlineMiami/swan.rsi

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterHotlineSwan
  name: swan gang jacket
  description: A worn jacket favored by the swan-masked crew.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan.rsi
  - type: Item
    size: Normal
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/swan.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95

# --- Bear (mask + gloves + armor + tank top) ---

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskHotlineBear
  name: bear mask
  description: A grinning bear mask, scuffed from use.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Mask/HotlineMiami/bear.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Mask/HotlineMiami/bear.rsi
  - type: Item
    sprite: _Sunset/Clothing/Mask/HotlineMiami/bear.rsi

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsHotlineBear
  name: bear gang gloves
  description: Thick gloves, stained dark at the knuckles.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Hands/HotlineMiami/bear.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Hands/HotlineMiami/bear.rsi
  - type: Item
    sprite: _Sunset/Clothing/Hands/HotlineMiami/bear.rsi

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterHotlineBear
  name: bear gang vest
  description: An olive combat vest with a snarling bear stitched on the back.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/bear.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/bear.rsi
  - type: Item
    size: Normal
    sprite: _Sunset/Clothing/OuterClothing/HotlineMiami/bear.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformHotlineBear
  name: bear gang tank top
  description: A teal tank top, faded from too many washes.
  components:
  - type: Sprite
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/bear.rsi
  - type: Clothing
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/bear.rsi
  - type: Item
    sprite: _Sunset/Clothing/Uniforms/HotlineMiami/bear.rsi

