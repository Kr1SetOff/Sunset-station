# 🌇Sunset🌇 - ported from Goobstation/Reserve-Station (_White origin): a self-recharging device
# that teleports the user forward, telefragging whoever's standing at the destination, with an
# emergency-teleport fallback (or a gib) if it lands inside a wall.

- type: entity
  id: ExperimentalSyndicateTeleporter
  parent: [ BaseItem, BaseSyndicateContraband ]
  name: experimental Syndicate teleporter
  description: A self-recharging device that teleports the user forward. In case of teleportation into a wall, uses emergency teleportation. Or gibs the user if it's out of charges.
  components:
  - type: Sprite
    sprite: _White/Objects/Devices/experimentalsyndicateteleporter.rsi
    layers:
    - state: icon
  - type: ExperimentalTeleporter
  - type: LimitedCharges
    maxCharges: 4
  - type: AutoRecharge
    rechargeDuration: 10

- type: entity
  id: ExperimentalTeleporterInEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: EvaporationSparkle
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    layers:
    - sprite: _White/Objects/Devices/experimentalsyndicateteleporter.rsi
      state: in
      shader: unshaded
    netsync: false
    drawdepth: Effects
  - type: PointLight
    color: "#008DFE"

- type: entity
  id: ExperimentalTeleporterOutEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: EvaporationSparkle
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    layers:
    - sprite: _White/Objects/Devices/experimentalsyndicateteleporter.rsi
      state: out
      shader: unshaded
    netsync: false
    drawdepth: Effects
  - type: PointLight
    color: "#008DFE"
