# 🌇Sunset🌇 - the clockwork slab's three built-in abilities. Not shown on the hotbar
# (autoPopulate: false) - reachable only via activating the slab (RatvarClockworkSlab, see gear.yml),
# which opens a radial wheel (Content.Client._Sunset.Ratvar.RatvarSlabBoundUserInterface). Unlike
# Nar'Sie's blood magic, these are granted directly alongside the slab itself - no separate carve ritual
# to unlock them (matches the ss220.space RU wiki: "the slab always has these").

- type: entity
  parent: BaseAction
  id: ActionRatvarSlabStun
  name: Оглушение
  description: Оглушает и заглушает жертву прикосновением заводной плиты.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 8
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/actions.rsi
      state: stun
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:RatvarSlabStunActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarSlabTeleport
  name: Телепортация
  description: Переносит тебя на небольшое расстояние.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/actions.rsi
      state: teleport
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarSlabTeleportActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarSlabHeal
  name: Заживление ран
  description: Лечит раны находящегося рядом собрата по культу.
  components:
  - type: Action
    autoPopulate: false
    useDelay: 7
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/actions.rsi
      state: heal
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:RatvarSlabHealActionEvent

# Brass/energy economy - porting the ss220.space RU wiki's "Рука Мидаса" and Herald's Beacon. Not
# reachable through the slab wheel (these are general utility, not slab-specific rites) - shown directly
# on the hotbar like the Nar'Sie cult's Blood Magic spells.

- type: entity
  parent: BaseAction
  id: ActionRatvarHandOfMidas
  name: Рука Мидаса
  description: Превращает тронутую стопку стали или пластали в латунные листы, 1 к 1.
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/actions.rsi
      state: midas
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Stack
    event: !type:RatvarHandOfMidasActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarPlaceBeacon
  name: Установить маяк
  description: Устанавливает маяк-глашатай, расходуя 6 листов латуни из активной руки. Маяк пассивно копит энергию для культа и лечит культистов рядом.
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/actions.rsi
      state: beacon
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RatvarPlaceBeaconActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatvarConcealGears
  name: Скрыть шестерни
  description: Скрывает алтарь, маяк-глашатай или мастерскую от посторонних глаз (и от своих собственных - не забудь, где спрятал). Повторное применение возвращает видимость.
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/clockwork_slab.rsi
      state: icon
  - type: TargetAction
    range: 3
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - RatvarAltar
      - RatvarHeraldsBeacon
      - RatvarWorkshop
    event: !type:RatvarConcealGearsActionEvent

# Craftable enchanted gear - porting the ss220.space RU wiki's brass/energy/time costs. One shared
# event/handler (RatvarCraftGearActionEvent, RatvarServantSystem.OnCraftGear) reads the actual
# cost/result off RatvarCraftGearComponent below instead of a bespoke handler per item.

- type: entity
  parent: BaseAction
  id: ActionRatvarCraftGauntlets
  name: Скрафтить латунные рукавицы
  description: Латунные рукавицы, наделяющие защитой владельца.
  components:
  - type: RatvarCraftGear
    brassCost: 1
    energyCost: 200
    craftTime: 5
    resultProto: ClothingHandsGauntletsClockwork
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Cult/Clothing/gauntlets.rsi
      state: icon
  - type: InstantAction
    event: !type:RatvarCraftGearActionEvent

