    brassCost: 3
    energyCost: 30
    craftTime: 3
    resultProto: MobRatvarCogscarab
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Sunset/Ratvar/cogscarab.rsi
      state: icon
  - type: InstantAction
    event: !type:RatvarCraftConstructActionEvent

- type: entity
