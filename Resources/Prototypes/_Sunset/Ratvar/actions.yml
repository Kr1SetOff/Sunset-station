# Constructs (allies) - RatvarCraftGear is reused as-is for cost/result data; only the event type
# differs (RatvarCraftConstructActionEvent spawns a mob instead of an item, see
# RatvarServantSystem.OnCraftConstruct) and there's a shared cap (RatvarServantRuleComponent.MaxConstructs)
# on how many can be alive at once.

- type: entity
  parent: BaseAction
  id: ActionRatvarCraftCogscarab
  name: Оживить когтескарабея
  description: Латунный когтескарабей - дешёвый и хрупкий, но быстрый разведчик и застрельщик.
  components:
