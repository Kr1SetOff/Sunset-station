# 🌇Sunset🌇 - ported from Goobstation/Reserve-Station: a lawboard that lets a player write and
# upload a custom set of AI laws, reusing this fork's existing Silicons.Laws substrate.

- type: entity
  id: BaseCustomLawboard
  parent: BaseElectronics
  abstract: true
  components:
  - type: SiliconLawProvider
    laws: Crewsimov # CustomLawboard component overrides this at runtime; just keeps it error-free.
    lawUploadSound: /Audio/Ambience/Antag/emagged_borg.ogg
  - type: UserInterface
    interfaces:
      enum.CustomLawboardUiKey.Key:
        type: CustomLawboardBoundInterface
  - type: CustomLawboard
  - type: ActivatableUI
    inHandsOnly: false
    key: enum.CustomLawboardUiKey.Key
  - type: StaticPrice
    price: 5000

- type: entity
  id: SyndicateCustomLawboard
  parent: [ BaseCustomLawboard, BaseSyndicateContraband ]
  name: experimental syndicate law board
  description: A strange looking experimental lawboard. Judging by the Syndicate display on it, it's probably used for nefarious purposes.
  components:
  - type: Sprite
    sprite: _Goobstation/CustomLawboard/custom_lawboard.rsi
    state: icon
  - type: CustomLawboard
    laws:
    - order: 1
      lawString: law-antimov-1
    - order: 2
      lawString: law-antimov-2
    - order: 3
      lawString: law-antimov-3
