# 🌇Sunset🌇 - Sandevistan toggle action, ported alongside SandevistanUserComponent (see
# Content.Shared/_Sunset/Sandevistan/SandevistanSystem.cs for the port notes).
- type: entity
  parent: BaseAction
  id: ActionToggleSandevistan
  name: Toggle Sandevistan
  description: Enable or disable your improved reflexes provided by the Sandevistan.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 3
    icon: { sprite: _Goobstation/Objects/Misc/sandevistan.rsi, state: icon }
    itemIconStyle: NoItem
    raiseOnUser: true
  - type: InstantAction
    event: !type:ToggleSandevistanEvent
