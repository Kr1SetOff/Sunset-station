# Карты SunSet Station. Файлы карт лежат в /Maps/_Sunset/ и имеют приписку "SS"
# слитно с названием станции. Только эти карты участвуют в голосовании и
# случайном выборе (см. пул SunSetMapPool и CVar game.map_pool).
# minPlayers: 0 + fallback: true -> карта доступна при любом онлайне.

- type: gameMap
  id: SSBagel
  mapName: 'Багель'
  mapPath: /Maps/_Sunset/Station/SSBagel.yml
  maxRandomOffset: 0
  randomRotation: false
  fallback: true
  minPlayers: 0
  stations:
    StarlightBagel:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Багель {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs:
            # command
            Captain: [ 1, 1 ]
            BlueShield: [ 1, 1 ]
            NanoTrasenRepresentative: [ 1, 1 ]
            # cargo
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            Bitrunner: [ 3, 3 ]
            CargoTechnician: [ 3, 3 ]
            # engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 4, 4 ]
            # medical
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 3, 3 ]
            Geneticist: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ]
            Psychologist: [ 1, 1 ]
            Paramedic: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            Surgeon: [ 1, 1 ]
            # science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 4, 4 ]
            Roboticist: [ 1, 1 ]
            # security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 4 ]
            SecurityCadet: [ 3, 3 ]
            Detective: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            Lawyer: [ 1, 1 ]
            # service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 2 ]
            Botanist: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Chef: [ 1, 1 ]
            Clown: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Librarian: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Assistant: [ -1, -1 ]
            #silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 2 ]

