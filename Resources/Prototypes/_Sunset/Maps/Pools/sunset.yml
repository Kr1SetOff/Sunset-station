# Пул карт SunSet Station. Голосование за карту и случайный/ротационный выбор
# берут карты только отсюда (см. CVar game.map_pool = SunSetMapPool).
# Все карты лежат в /Maps/_Sunset/ с припиской "SS".
- type: gameMapPool
  id: SunSetMapPool
  maps:
  - SSBagel
  - SSBox
  - SSCluster
  - SSFland
  - SSHotel
  - SSPacket
