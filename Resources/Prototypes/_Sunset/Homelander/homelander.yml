# 🌇Sunset🌇 - Homelander: a near-invulnerable superhuman antagonist.

# 60% intrinsic damage reduction on everything (radiation stays his weak point at 20%) - the other
# 15 percentage points of his old 75% total now live on ClothingOuterHomelanderArmor instead (see
# _Sunset/Homelander/clothing.yml), so losing the suit (only possible after death - it's
# self-unremovable while alive) would actually matter.
- type: damageModifierSet
  id: Homelander
  coefficients:
    Blunt: 0.40
    Slash: 0.40
    Piercing: 0.40
    Heat: 0.40
    Shock: 0.40
    Cold: 0.40
    Caustic: 0.40
    Poison: 0.40
    Bloodloss: 0.40
    Asphyxiation: 0.40
    Radiation: 0.8

# Heat vision: starts a twin-laser channel (up to 25s) that continuously tracks the mouse cursor
# (MouseRotatorComponent, added for the duration in HomelanderSystem.OnHeatVision) and deals damage
# on a tick interval - see HomelanderSystem.FireLaserTick. Pressing the action again while
# channeling toggles it off early; either way the action only goes on cooldown once the channel
# actually ends (see HomelanderSystem.EndLaser), not at activation.
- type: entity
  parent: BaseAction
  id: ActionHomelanderHeatVision
  name: Heat Vision
  description: Burn everything in your sight with twin beams from your eyes. Activate again to stop early. Lasts up to 25 seconds.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon: { sprite: _Sunset/Interface/Actions/homelander.rsi, state: heat_vision }
  - type: InstantAction
    event: !type:HomelanderHeatVisionEvent
      duration: 25
      lockout: 30
      range: 15
      eyeOffset: 0.06
      damagePerSecond:
        types:
          Heat: 16
