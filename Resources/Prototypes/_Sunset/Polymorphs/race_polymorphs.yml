# 🌇Sunset🌇 - permanent race polymorphs used by the Darwinium reagent family
# (Resources/Prototypes/_Sunset/Reagents/darwinium.yml). Name and inventory carry over;
# damage does not (the transformation rebuilds the body).

- type: polymorph
  id: SunsetRacePolymorphHuman
  configuration:
    entity: MobHuman
    forced: true
    transferName: true
    transferDamage: false
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    allowRepeatedMorphs: true
    ignoreAllowRepeatedMorphs: true

