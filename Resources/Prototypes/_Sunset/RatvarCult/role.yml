# 🌇Sunset🌇 - Ratvar cultist antagonist role (clockwork cult, ported in scoped-down form from
# tg/station). Roundstart hidden-antag team picked by the RatvarCult rule (see game_rule.yml).

- type: antag
  id: RatvarCultist
  name: roles-antag-ratvar-cultist-name
  antagonist: true
  setPreference: true
  objective: roles-antag-ratvar-cultist-objective
  playTimeTracker: AntagRatvarCultist
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 15h

# Hours played as a Ratvar cultist are tracked like any other role.
- type: playTimeTracker
  id: AntagRatvarCultist
  name: roles-antag-ratvar-cultist-name

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleRatvarCultist
  name: роль культиста Ратвара
  components:
  - type: MindRole
    antagPrototype: RatvarCultist
    exclusiveAntag: true
    subtype: role-subtype-ratvar-cultist
