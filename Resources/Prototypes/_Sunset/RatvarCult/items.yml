# 🌇Sunset🌇 - Ratvar cult (clockwork cult) gear, ported from tg/station. Sprites are tg's
# clockwork cult assets (see the RSI meta.json files for exact sources).

- type: entity
  parent: BaseItem
  id: WeaponRatvarianSpear
  name: ратварианское копьё
  description: Латунное копьё, пронизанное энергией Ратвара. В руках верующего бьёт с силой заводного молота.
  components:
  - type: Sharp
  - type: Sprite
    sprite: _Sunset/RatvarCult/ratvarian_spear.rsi
    state: icon
  - type: Item
    size: Large
    sprite: _Sunset/RatvarCult/ratvarian_spear.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.8
    range: 1.6
    damage:
      types:
        Piercing: 17
        Shock: 6
    soundHit:
      path: /Audio/_Sunset/RatvarCult/ratvar_attack.ogg
      params:
        volume: -4
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 17
        Shock: 6
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterClockworkCuirass
  name: заводная кираса
  description: Тяжёлая латунная кираса, отлитая по канонам Ратвара. Шестерни внутри неё тихо тикают.
  components:
  - type: Sprite
    sprite: _Sunset/RatvarCult/clockwork_cuirass.rsi
    state: icon
  - type: Clothing
    sprite: _Sunset/RatvarCult/clockwork_cuirass.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.75
        Heat: 0.8
        Shock: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadClockworkHelmet
  name: заводной шлем
  description: Латунный шлем культиста Ратвара. Сквозь прорези видно тусклое жёлтое свечение.
  components:
  - type: Sprite
    sprite: _Sunset/RatvarCult/clockwork_helmet.rsi
    state: icon
  - type: Clothing
    sprite: _Sunset/RatvarCult/clockwork_helmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.85

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsClockworkGauntlets
  name: заводные латные перчатки
  description: Массивные латунные перчатки, гудящие от заключённой в них энергии.
  components:
  - type: Sprite
    sprite: _Sunset/RatvarCult/clockwork_gauntlets.rsi
    state: icon
  - type: Clothing
    sprite: _Sunset/RatvarCult/clockwork_gauntlets.rsi
  - type: Insulated

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesClockworkTreads
  name: заводные сабатоны
  description: Латунные сапоги культа Ратвара. Оставляют за собой едва заметный запах смазки.
  components:
  - type: Sprite
    sprite: _Sunset/RatvarCult/clockwork_treads.rsi
    state: icon
  - type: Clothing
    sprite: _Sunset/RatvarCult/clockwork_treads.rsi
  - type: NoSlip

- type: startingGear
  id: RatvarCultistGear
  storage:
    back:
    - WeaponRatvarianSpear
    - ClothingOuterClockworkCuirass
    - ClothingHeadClockworkHelmet
    - ClothingHandsClockworkGauntlets
    - ClothingShoesClockworkTreads
