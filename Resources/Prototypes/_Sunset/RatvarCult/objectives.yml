# 🌇Sunset🌇 - Ratvar cult objectives. Assigned to every cultist via the RatvarCult rule's
# AntagObjectives component (see game_rule.yml).

- type: entity
  parent: [ BaseKillObjective ]
  id: RatvarCultSacrificeObjective
  name: objective-condition-ratvar-sacrifice-title
  description: objective-condition-ratvar-sacrifice-description
  components:
  - type: Objective
    issuer: objective-issuer-ratvar
    difficulty: 1.5
    unique: false
    icon:
      sprite: _Sunset/RatvarCult/ratvarian_spear.rsi
      state: icon
  - type: TargetObjective
    title: objective-condition-ratvar-sacrifice-title
  - type: PickRandomPerson
    filters:
    # Can't stack multiple sacrifice objectives onto the same victim.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireMaroon: true

- type: entity
  parent: BaseSurviveObjective
  id: RatvarCultSurviveObjective
  name: objective-condition-ratvar-survive-title
  description: objective-condition-ratvar-survive-description
  components:
  - type: Objective
    issuer: objective-issuer-ratvar
    difficulty: 1
    icon:
      sprite: _Sunset/RatvarCult/clockwork_helmet.rsi
      state: icon
