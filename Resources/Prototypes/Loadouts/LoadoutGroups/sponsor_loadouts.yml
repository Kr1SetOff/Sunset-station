# 🌇Sunset🌇 - "Спонсорка" tab: sponsor-exclusive cosmetics, shared across every job's loadout window
# (see role_loadouts.yml, group added to every Job* entry). Gated behind SponsorTierLoadoutEffect so
# only linked Boosty sponsors (tier 1+) can select anything from it; a handful of items are further
