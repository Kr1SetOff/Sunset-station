# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Supporting entities/prototypes for the ported wizard spells that Goob-Station defines but were
# never carried over during the port (no source assets for most of these - see actions.yml for the
# same note on icons). Reuses existing vanilla assets/entities wherever a reasonable fit exists.

# --- Effects ---

- type: entity
  parent: BaseMagicalContraband
  id: Chronofield
  name: chronofield
  description: A field of frozen time.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/chronofield.rsi
    state: chronofield
  - type: TimedDespawn
    lifetime: 8
  - type: PointLight
    radius: 3
    color: "#8888ff"
    energy: 2

- type: entity
  parent: BaseMagicalContraband
  id: EffectRepulse
  name: repulsion wave
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/explosion.rsi
    state: explosion
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  id: EmpFlashEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/emp.rsi
    state: emp_pulse
  - type: TimedDespawn
    lifetime: 0.7
  - type: PointLight
    radius: 3
    color: "#88f2ff"
    energy: 2

- type: entity
  id: EffectElectricity
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/lightning.rsi
    state: yellow_lightning
  - type: TimedDespawn
    lifetime: 0.7

# --- Projectiles ---

- type: entity
