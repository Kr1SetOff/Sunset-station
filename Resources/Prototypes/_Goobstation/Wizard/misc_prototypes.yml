# --- Traps ---

- type: entity
  abstract: true
  id: BaseWizardTrap
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  components:
  - type: WizardTrap
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        hard: false
        layer:
        - MobLayer
        mask:
        - MobMask
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    state: spell_default

- type: entity
  parent: BaseWizardTrap
  id: TrapShock
  name: shock trap
  description: A magical trap that shocks whoever steps on it.
  components:
  - type: StunTrap

- type: entity
  parent: BaseWizardTrap
  id: TrapFlame
  name: flame trap
  description: A magical trap that sets whoever steps on it ablaze.
  components:
  - type: FlameTrap

- type: entity
  parent: BaseWizardTrap
  id: TrapDamage
  name: damage trap
  description: A magical trap that lashes out at whoever steps on it.
  components:
  - type: DamageTrap
    damage:
      types:
        Piercing: 15

- type: entity
  parent: BaseWizardTrap
  id: TrapChill
  name: chill trap
  description: A magical trap that freezes whoever steps on it.
  components:
  - type: ChillTrap

- type: entity
  parent: BaseWizardTrap
  id: TrapBlind
  name: blinding trap
  description: A magical trap that blinds whoever steps on it.
  components:
  - type: BlindingTrap

