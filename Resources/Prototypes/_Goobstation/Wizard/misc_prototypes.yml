    sprite: Objects/Magic/magicactions.rsi
    scale: 0.6, 0.6
    layers:
    - state: fireball
  - type: Projectile
    damage:
      types:
        Radiation: 1

- type: entity
  parent: BaseBullet
  id: ProjectileBananaPeel
  name: banana peel
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
    layers:
    - state: peel
  - type: Projectile
    damage: {}

- type: entity
  parent: BaseBullet
  id: ProjectileMagicMissile
  name: magic missile
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    scale: 0.6, 0.6
    layers:
    - state: magicmissile
  - type: Projectile
