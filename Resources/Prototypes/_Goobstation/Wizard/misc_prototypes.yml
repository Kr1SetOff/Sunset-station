# --- Weighted random spell/mob tables ---
# Note: weightedRandomEntity requires real EntityPrototype ids, so these reference the action
# entities directly (not the SpellbookXxx store listing ids the store UI uses).

- type: weightedRandomEntity
  id: FullRandomSpellTable
  weights:
    ActionMimeMalaise: 1
    ActionBananaTouch: 1
    ActionCluwneCurse: 1
    ActionCorpseExplosion: 1
    ActionBlindSpell: 1
    ActionMutateSpell: 1
    ActionTeslaBlast: 1
    ActionLightningBolt: 1
    ActionHomingToolbox: 1
    ActionMagicMissile: 1
    ActionDisableTech: 1
    ActionInstantSummons: 1
    ActionSwapSpell: 1
    ActionSoulTap: 1
    ActionTileToggle: 1

- type: weightedRandomEntity
  id: LethalSpellTable
  weights:
    ActionCorpseExplosion: 1
    ActionTeslaBlast: 1
    ActionLightningBolt: 1
    ActionMagicMissile: 1
    ActionSanguineStrike: 1

- type: weightedRandomEntity
  id: MobilitySpellTable
  weights:
    ActionTeleportWizard: 1
    ActionSwapSpell: 1
    ActionInstantSummons: 1

- type: weightedRandomEntity
  id: SimianMobTable
  weights:
    MobMonkey: 1

- type: weightedRandomEntity
  id: SimianWeaponTable
  weights:
    ToolboxMechanical: 1

