  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    scale: 0.6, 0.6
    layers:
    - state: spell_default
  - type: Projectile
    damage:
      types:
        Slash: 8

- type: entity
  parent: BaseItem
  id: ArcaneBarrage
  name: arcane barrage
  description: A conjured weapon that fires bolts of arcane energy.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Gun
    fireRate: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileMagicMissile
    capacity: 10
    count: 10
  - type: TimedDespawn
    lifetime: 30
  - type: StaticPrice
    price: 0

- type: entity
  parent: ThrowingKnife
  id: ThrownLightning
  name: bolt of lightning
  description: A crackling bolt of pure lightning.
  components:
  - type: Sprite
    sprite: Effects/lightning.rsi
    state: yellow_lightning
  - type: MeleeWeapon
    damage:
      types:
        Shock: 20
  - type: LandAtCursor
  - type: TimedDespawn
    lifetime: 10

