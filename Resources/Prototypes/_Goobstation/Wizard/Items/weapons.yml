- type: entity
  name: supermatter halberd
  parent: [BaseItem, BaseMagicalContraband]
  id: SupermatterHalberd
  description: The revered weapon of Oblivion Enforcers, used to enforce the Order's will.
  components:
  - type: Sharp
  - type: Sprite
    sprite: _Goobstation/Wizard/Objects/Weapons/smhalberd.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.75
    damage:
      types:
        Slash: 2
        Piercing: 2
        Radiation: 5
        Structural: 5
      armorPenetration: 0.8
      woundSeverityMultipliers:
        Slash: 2.5
        Piercing: 2.5
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 8
        Piercing: 8
        Radiation: 15
        Structural: 10
      armorPenetration: 0.8
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Goobstation/Wizard/Objects/Weapons/smhalberd.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      suitstorage:
      - state: equipped-BACKPACK
  - type: UseDelay
    delay: 1
    delays:
      knockdown:
        length: 4
  - type: KnockdownOnHit
    duration: 4
    dropItems: true
    knockdownOnHeavyAttack: false
  - type: UseDelayBlockKnockdown
    delay: knockdown
  - type: SupermatterHalberd
    obliterateWhitelist:
      components:
      - Airlock
      - Firelock
      - Door
      tags:
      - Wall
      - Window
      - Airlock
      - GlassAirlock
  - type: SupermatterImmune
  - type: StaticPrice
    price: 50000

- type: entity
  name: high frequency blade
  parent: [BaseSword, BaseMagicalContraband]
  id: HighFrequencyBlade
  description: A sword reinforced by a powerful alternating current and resonating at extremely high vibration frequencies. This oscillation weakens the molecular bonds of anything it cuts, thereby increasing its cutting ability.
  components:
  - type: Sprite
    sprite: _Goobstation/Wizard/Objects/Weapons/hfrequency.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 8
    autoAttack: true
    heavyStaminaCost: 0
    damage:
      types:
        Slash: 5
        Structural: 10
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
    animation: WeaponArcHighFreq
  - type: Clothing
    sprite: _Goobstation/Wizard/Objects/Weapons/hfrequency.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      suitstorage:
      - state: equipped-BACKPACK
  - type: Reflect
    reflectProb: .3
    slotFlags:
      - NONE
  - type: LightAttackDamageMultiplier
    multiplier: 3
    extraSound:
      path: /Audio/_Goobstation/Wizard/zapbang.ogg
      params:
        variation: 0.250
        volume: -5
  - type: ThrowableBlocker
    blockSound:
      path: /Audio/_Goobstation/Wizard/zapbang.ogg
      params:
        variation: 0.250
  - type: StaticPrice
    price: 50000

- type: entity
  name: spellblade
  parent: [BaseSword, BaseMagicalContraband]
  id: Spellblade
  description: An enchanted blade with a series of runes along the side.
  components:
  - type: Sprite
    sprite: _Goobstation/Wizard/Objects/Weapons/spellblade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 30
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: Clothing
    sprite: _Goobstation/Wizard/Objects/Weapons/spellblade.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      suitstorage:
      - state: equipped-BACKPACK
  - type: Spellblade
    prototypes:
    - EnchantmentLightning
    - EnchantmentFire
    - EnchantmentBluespace
    - EnchantmentSpacetime
    - EnchantmentForceshield
  - type: UserInterface
    interfaces:
      enum.SpellbladeUiKey.Key:
        type: SpellbladeBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.SpellbladeUiKey.Key
  - type: StaticPrice
    price: 50000

# NOTE: parent LavalandBaseKatana does not exist in this codebase (no _Lavaland content has been
# ported). This entity is ported as-instructed but will fail to resolve until LavalandBaseKatana
# (source: Resources/Prototypes/_Lavaland/Entities/Objects/Weapons/Melee/katanas.yml) is ported,
# which is out of scope for this task. See final report for details.
- type: entity
  name: echo katana
  description: Vibrations are constantly flowing through this sword, like they desperately try to find a way out.
  parent: [ LavalandBaseKatana, BaseMagicalContraband ]
  id: EchoKatana
  components:
  - type: Sprite
    layers:
    - state: blade
      color: "#be69ff"
    - state: handle
  - type: Item
    #storedSprite:
    #  state: storage
    #  sprite: Objects/Weapons/Melee/katana_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    inhandVisuals:
      left:
      - state: handle-inhand-left
      - state: blade-inhand-left
        color: "#be69ff"
      right:
      - state: handle-inhand-right
      - state: blade-inhand-right
        color: "#be69ff"
  - type: Clothing
    clothingVisuals:
      back:
      - state: handle-equipped-BACKPACK
      - state: blade-equipped-BACKPACK
        color: "#be69ff"
      belt:
      - state: handle-equipped-BELT
      - state: blade-equipped-BELT
        color: "#be69ff"
  - type: MeleeWeapon
    damage:
      types:
        Slash: 25
      woundSeverityMultipliers:
        Slash: 3 # Epic delimbing
  - type: MeleeDash
    length: 5.5
  - type: UseDelay
    delay: 1.5
