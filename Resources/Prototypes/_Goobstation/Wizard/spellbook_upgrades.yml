# Ported from Goob-Station's Resources/Prototypes/_Goobstation/Wizard/spellbook_upgrades.yml
#
# NOT ported: SpellbookSmiteUpgrade, SpellbookKnockUpgrade, SpellbookRepulseUpgrade,
# SpellbookSmokeUpgrade, SpellbookForceWallUpgrade, SpellbookBlinkUpgrade, SpellbookChargeUpgrade,
# SpellbookMindSwapUpgrade, SpellbookRodFormUpgrade. Their base spells (Smite/Knock/Repulse/Smoke/
# ForceWall/Blink/Charge/MindSwap/RodForm) already exist in this codebase's base
# Resources/Prototypes/Catalog/spellbook_catalog.yml using a different, non-Goob productAction
# implementation without the ActionUpgrade->leveled-variant wiring Goob's leveling system expects.
# Wiring these upgrade listings onto the pre-existing base spells was judged out of scope/risky for
# a YAML-only port (would require touching/verifying the base game's independent spell system).
# See final report for details.
#
# The 23 upgrades below were previously non-functional: their base actions
# (Resources/Prototypes/_Goobstation/Wizard/actions.yml) had no ActionUpgrade component at all, so
# TryUpgradeAction always failed and every purchase silently refunded. Each base action now has a
# single Level 2 variant (<ActionName>2) whose only change is requiresClothes: false on the Magic
# component - lets the spell be cast without full wizard robes equipped. This was chosen as a safe,
# universal upgrade effect since most of these spells don't expose a scalable "power" DataField to
# buff instead (no per-spell balance data survived the port). stock is capped at 1 to match - buying
# past level 2 would otherwise silently fail/refund since no level 3+ variant exists.
#
# Also removed: the generic `icon: {sprite: Objects/Magic/magicactions.rsi, state: spell_default}`
# override on every listing below. Content.Client/Store/Ui/StoreMenu.xaml.cs falls back to the
# granted action's own icon only when Icon is null - with it explicitly set, every upgrade showed
# the same placeholder icon instead of its actual spell's icon.

# Offensive
- type: listing
  id: SpellbookMimeMalaiseUpgrade
  productUpgradeId: SpellbookMimeMalaiseUpgrade
  name: spellbook-upgrade-mime-malaise-name
  description: spellbook-upgrade-mime-malaise-desc
  cost:
    WizCoin: 1
  categories:
  - SpellbookOffensive
  conditions:
  - !type:BuyBeforeCondition
    whitelist:
    - SpellbookMimeMalaise
  - !type:ListingLimitedStockCondition
    stock: 1

