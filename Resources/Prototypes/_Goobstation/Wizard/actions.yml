# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Action entities for the ported Goob-Station wizard spells. None of Goob-Station's original
# actions.rsi icon sheet or per-spell sound effects were ported (the whole asset folder never
# existed in this repo), so every action here reuses the vanilla Objects/Magic/magicactions.rsi
# "spell_default" icon as a functional placeholder rather than going without an icon entirely.

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseGoobWizardAction
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: Magic
    requiresClothes: true

- type: entity
  abstract: true
  parent: BaseGoobWizardAction
  id: BaseGoobWizardEntityTargetAction
  components:
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    checkCanInteract: false
    whitelist:
      components:
      - MobState

- type: entity
  abstract: true
  parent: BaseGoobWizardAction
  id: BaseGoobWizardWorldTargetAction
  components:
  - type: TargetAction
    interactOnMiss: false
  - type: WorldTargetAction

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionMimeMalaise
  name: Mime's Malaise
  description: Turns your target into a mime, silencing them.
  components:
  - type: Magic
    school: Mime
  - type: EntityTargetAction
    event: !type:MimeMalaiseEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionBananaTouch
  name: Banana Touch
  description: Turns your target into a clown.
  components:
  - type: Magic
    school: Transmutation
  - type: EntityTargetAction
    event: !type:BananaTouchEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionCluwneCurse
  name: Cluwne Curse
  description: Curses your target with the visage of the Cluwne.
  components:
  - type: Magic
    school: Transmutation
  - type: EntityTargetAction
    event: !type:CluwneCurseEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionCorpseExplosion
  name: Corpse Explosion
  description: Detonates a corpse in a burst of gore.
  components:
  - type: Magic
    school: Necromancy
  - type: EntityTargetAction
    event: !type:CorpseExplosionEvent
      damage:
        types:
          Piercing: 20

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionBlindSpell
  name: Blind
  description: Blinds your target.
  components:
  - type: Magic
    school: Evocation
  - type: EntityTargetAction
    event: !type:BlindSpellEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionMutateSpell
  name: Mutate
  description: Turns you into a hulking abomination for a short time.
  components:
  - type: Magic
    school: Transmutation
  - type: InstantAction
    event: !type:MutateSpellEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionTeslaBlast
  name: Tesla Blast
  description: Summons an arc of supercharged lightning after a short delay.
  components:
  - type: Magic
    school: Evocation
  - type: InstantAction
    event: !type:TeslaBlastEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionLightningBolt
  name: Lightning Bolt
  description: Strikes your target with a bolt of lightning.
  components:
  - type: Magic
    school: Evocation
  - type: EntityTargetAction
    event: !type:LightningBoltEvent

- type: entity
  parent: BaseGoobWizardWorldTargetAction
  id: ActionHomingToolbox
  name: Homing Toolbox
  description: Summons a toolbox that relentlessly homes in on your target.
  components:
  - type: Magic
    school: Conjuration
  - type: WorldTargetAction
    event: !type:HomingToolboxEvent

- type: entity
  parent: BaseGoobWizardWorldTargetAction
  id: ActionSpellCards
  name: Spell Cards
  description: Fires a spray of razor-sharp spell cards.
  components:
  - type: Magic
    school: Evocation
  - type: WorldTargetAction
    event: !type:SpellCardsEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionArcaneBarrage
  name: Arcane Barrage
  description: Summons a barrage of arcane projectiles around you.
  components:
  - type: Magic
    school: Evocation
  - type: InstantAction
    event: !type:ArcaneBarrageEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionLesserSummonGuns
  name: Lesser Summon Guns
  description: Conjures an enchanted bolt-action rifle.
  components:
  - type: Magic
    school: Conjuration
  - type: InstantAction
    event: !type:LesserSummonGunsEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionBarnyardCurse
  name: Barnyard Curse
  description: Curses your target with the form of a random animal.
  components:
  - type: Magic
    school: Transmutation
  - type: EntityTargetAction
    event: !type:BarnyardCurseEvent
      masks:
        ClothingMaskFox: null
        ClothingMaskBear: null
        ClothingMaskRat: null
        ClothingMaskBee: null
        ClothingMaskRaven: null
        ClothingMaskJackal: null
        ClothingMaskBat: null

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionScreamForMe
  name: Scream For Me
  description: Makes your target scream in agony and bleed profusely.
  components:
  - type: Magic
    school: Sanguine
  - type: EntityTargetAction
    event: !type:ScreamForMeEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionLesserSummonBees
  name: Lesser Summon Bees
  description: Summons a swarm of bees to fight for you.
  components:
  - type: Magic
    school: Conjuration
  - type: InstantAction
    event: !type:SummonMobsEvent
      mobs:
      - MobBee

- type: entity
  parent: BaseGoobWizardAction
  id: ActionSummonSimians
  name: Summon Simians
  description: Summons armed monkeys to fight for you.
  components:
  - type: Magic
    school: Conjuration
  - type: InstantAction
    event: !type:SummonSimiansEvent
      mobs: SimianMobTable
      weapons: SimianWeaponTable
  - type: Tag
    tags:
    - SummonSimiansMaxLevelAction

- type: entity
  parent: BaseGoobWizardAction
  id: ActionSanguineStrike
  name: Exsanguinating Strike
  description: Your next melee attack drains blood and heals you.
  components:
  - type: Magic
    school: Sanguine
  - type: InstantAction
    event: !type:ExsanguinatingStrikeEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionRathenSpell
  name: Rathen's Curse
  description: Something is very wrong with your digestive system.
  components:
  - type: Magic
    school: Chuuni
  - type: InstantAction
    event: !type:RathenEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionMagicMissile
  name: Magic Missile
  description: Fires a homing bolt of arcane energy.
  components:
  - type: Magic
    school: Evocation
  - type: InstantAction
    event: !type:MagicMissileEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionDisableTech
  name: Disable Tech
  description: Disables electronics in a wide radius.
  components:
  - type: Magic
    school: Explosion
  - type: InstantAction
    event: !type:DisableTechEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionStopTime
  name: Stop Time
  description: Freezes everyone around you in place for a short time.
  components:
  - type: Magic
    school: Translocation
  - type: InstantAction
    event: !type:StopTimeEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionBindSoul
  name: Bind Soul
  description: Binds your soul to an item, granting you the power of lichdom.
  components:
  - type: Magic
    school: Forbidden
  - type: InstantAction
    event: !type:BindSoulEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionTrapsSpell
  name: The Traps
  description: Conjures a scattering of magical traps around you.
  components:
  - type: Magic
    school: Conjuration
  - type: InstantAction
    event: !type:TrapsSpellEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionChuuniInvocations
  name: Chuuni Invocations
  description: Grants you a chuunibyou eyepatch and its dark powers.
  components:
  - type: Magic
    school: Chuuni
  - type: InstantAction
    event: !type:ChuuniInvocationsEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionThrownLightning
  name: Thrown Lightning
  description: Hurls a bolt of lightning at your target.
  components:
  - type: Magic
    school: Evocation
  - type: InstantAction
    event: !type:ThrownLightningEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionInstantSummons
  name: Instant Summons
  description: Summons a marked item directly into your hand.
  components:
  - type: Magic
    school: Translocation
  - type: InstantAction
    event: !type:InstantSummonsEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionTeleportWizard
  name: Teleport
  description: Teleports you to a known location.
  components:
  - type: Magic
    school: Translocation
  - type: InstantAction
    event: !type:WizardTeleportEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionSwapSpell
  name: Swap
  description: Swaps places with your target.
  components:
  - type: Magic
    school: Translocation
  - type: EntityTargetAction
    event: !type:SwapSpellEvent

- type: entity
  parent: BaseGoobWizardAction
  id: ActionSoulTap
  name: Soul Tap
  description: Sacrifices some of your maximum health for power.
  components:
  - type: Magic
    school: Forbidden
  - type: InstantAction
    event: !type:SoulTapEvent

- type: entity
  parent: BaseGoobWizardEntityTargetAction
  id: ActionTileToggle
  name: Tile Toggle
  description: Toggles the targeted tile between floor and open space.
  components:
  - type: Magic
    school: Transmutation
  - type: EntityTargetAction
    event: !type:TileToggleSpellEvent
    whitelist: null

- type: entity
  parent: BaseGoobWizardAction
  id: ActionSummonStickmen
  name: Summon Stickmen
  description: Summons a horde of paper stickmen to fight for you.
  components:
  - type: Magic
    school: Conjuration
  - type: InstantAction
    event: !type:SummonMobsEvent
      mobs:
      - MobCarp

- type: entity
  parent: BaseAction
  id: ActionGorillaForm
  name: Gorilla Form
  description: Transforms you into a mighty gorilla.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: Magic
    school: Transmutation
    requiresClothes: false
  - type: InstantAction
    event: !type:PolymorphSpellEvent
      protoId: RampagingGorilla
      makeWizard: false
  - type: Tag
    tags:
    - GorillaFormAction
