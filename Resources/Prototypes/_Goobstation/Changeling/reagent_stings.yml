- type: reagentStingConfiguration
  id: StingMute
  reagents:
    MuteToxin: 2

- type: reagentStingConfiguration
  id: StingBlind
  reagents:
    BlindToxin: 2

- type: reagentStingConfiguration
  id: StingCryo
  reagents:
    Fresium: 10

- type: reagentStingConfiguration
  id: StingLethargic
  # Tirizene doesn't exist anywhere in this codebase (never ported) - ChloralHydrate alone already
  # provides the slowdown/lethargy effect this sting is going for.
  reagents:
    ChloralHydrate: 10
