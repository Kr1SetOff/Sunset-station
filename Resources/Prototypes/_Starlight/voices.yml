# 🌇Sunset🌇 - replaced the inherited Starlight roster (352 generic dataset voices, ids 0-342/1000-1023)
# with the curated RVC character roster from the Sunset TTS server (see D:\github govna\TTS\voices.json -
# a separate repo, not part of this one). Every entry below has a real RVC voice-conversion model backing
# it server-side; `voice:` must match the numeric key in that TTS server's voices.json exactly, or the
# server will fall back to a generic Silero speaker instead of the character voice. Id "2001" (station
# announcements) is deliberately NOT exposed here as a prototype - it's a hardcoded fallback int
# (TTSSystem.DefaultAnnounceVoice) that bypasses the prototype system entirely, so adding it here would
# just make an "announcement" voice wrongly selectable as a player's character voice.

