# REWARDS

- type: damnation
  id: SpaceImmunity
  name: иммунитет к вакууму
  category: constitution
  description: Подписант становится невосприимчив к вакууму космоса, более не скованный страхом перед ним.
  cost: 8
  removedComponents:
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.85
        Heat: 0.1
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Temperature

- type: damnation
