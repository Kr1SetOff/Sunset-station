# Devil damnations

## Categories:
### Constitution - relating to health, body
### Psyche - relating to mind, ability to do things
### Materiel - relating to physical things, taking something away or giving something

## Cost:
### Cost should be balanced such that "Soul" remains the most desirable punishment.
### Even if your damnation has a fate worse than having your soul taken, you should not go above 10 points,
### otherwise it becomes the focus of the deals that the devil does.
### Also keep in mind that if your deal is fatal, the cost should not necessarily be high, because people are
### likely to chain it on along with Soul anyway if it guaranteed round removes them at some point
### Devil deals should focus on enhancing existing chaos, deals that create new chaos (i.e. spawn a terminator or minor antag)
### Should be heavily limited in use, otherwise we just end up with people spawning 12 terminators for shits and giggles.

# CURSES

- type: damnation
  id: Soul
  name: моя душа
  category: psyche
  description: Подписант жертвует вам свою душу. После его смерти она отправится в глубины ада, а тело станет невозможно воскресить.
  cost: -10
  components:
  - type: Unrevivable
    reasonMessage: defibrillator-damned
  actions:
  - !type:DamnationActionAddAlert
    alerts:
    - SoulDebt

- type: damnation
  id: Pacifism
  name: отказ от борьбы
  category: psyche
  description: Подписант отказывается от внутреннего стремления к борьбе и теряет способность причинять вред — живому или неживому.
  cost: -3
  components:
  - type: Pacified
    disallowAllCombat: true

- type: damnation
  id: Blindness
  name: моё зрение
  category: constitution
  description: Подписант лишается способности видеть.
  cost: -3
  components:
  - type: PermanentBlindness
    blindness: 0

- type: damnation
  id: Time
  name: моя жизнь
  category: constitution
  description: Подписант жертвует своей жизнью — ему остаётся не более пяти минут.
  cost: -8
  reverseOnRemove: false # prevent cheesing it for points
  components:
  - type: Doomed

- type: damnation
  id: Credits
  name: мои сбережения
  category: materiel
  description: Подписант жертвует 5000 кредитов.
  cost: -5
  actions:
  - !type:DamnationActionDeductCredits
    amount: 5000

- type: damnation
  id: Purpose
  name: моя цель в жизни
  category: psyche
  description: Подписанта постигает участь хуже смерти.
  cost: -6
  components:
  - type: Cluwne

- type: damnation
  id: Humanity
  name: моя человечность
  category: constitution
  description: Подписант регрессирует в более примитивную форму.
  cost: -5
