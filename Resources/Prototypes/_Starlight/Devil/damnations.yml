- type: damnation
  id: Organ
  name: мой орган
  category: constitution
  description: Подписант теряет случайный орган — это может быть что угодно, от лёгких до почки.
  cost: -6
  actions:
  - !type:DamnationActionRemoveOrgan

- type: damnation
  id: Terminator
  name: стать мишенью
  category: materiel
  description: Будущее едва заметно меняется, и подписант оказывается на прицеле у мстительного исполнителя.
  cost: -4
  maxUses: 1
  actions:
