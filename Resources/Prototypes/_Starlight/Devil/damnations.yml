# CURSES

- type: damnation
  id: Soul
  name: моя душа
  description: Подписант жертвует вам свою душу. После его смерти она отправится в глубины ада, а тело станет невозможно воскресить.
  cost: -10
  components:
  - type: Unrevivable
    reasonMessage: defibrillator-damned
  actions:
  - !type:DamnationActionAddAlert
    alerts:
    - SoulDebt

- type: damnation
  id: Pacifism
  name: отказ от борьбы
  description: Подписант отказывается от внутреннего стремления к борьбе и теряет способность причинять вред — живому или неживому.
  cost: -3
  components:
  - type: Pacified
    disallowAllCombat: true

- type: damnation
  id: Blindness
  name: моё зрение
  description: Подписант лишается способности видеть.
  cost: -3
  components:
  - type: PermanentBlindness
    blindness: 0

- type: damnation
  id: Time
  name: моя жизнь
  description: Подписант жертвует своей жизнью — ему остаётся не более пяти минут.
  cost: -8
  reverseOnRemove: false # prevent cheesing it for points
  components:
  - type: Doomed

- type: damnation
  id: Credits
  name: мои сбережения
  description: Подписант жертвует 5000 кредитов.
  cost: -5
  actions:
  - !type:DamnationActionDeductCredits
    amount: 5000

- type: damnation
  id: Purpose
  name: моя цель в жизни
  description: Подписанта постигает участь хуже смерти.
  cost: -6
  components:
  - type: Cluwne

- type: damnation
  id: Humanity
  name: моя человечность
  description: Подписант регрессирует в более примитивную форму.
  cost: -5
  actions:
  - !type:DamnationActionPolymorph
    polymorph: IrreversibleMonkey

- type: damnation
  id: Organ
  name: мой орган
  description: Подписант теряет случайный орган — это может быть что угодно, от лёгких до почки.
  cost: -6
  actions:
  - !type:DamnationActionRemoveOrgan

- type: damnation
  id: Terminator
  name: стать мишенью
  description: Будущее едва заметно меняется, и подписант оказывается на прицеле у мстительного исполнителя.
  cost: -4
  actions:
  - !type:DamnationActionTerminator

- type: damnation
  id: Mute
  name: мой голос
  description: Делает подписанта немым.
  cost: -2
  components:
  - type: Muted

# REWARDS

- type: damnation
  id: SpaceImmunity
  name: иммунитет к вакууму
  description: Подписант становится невосприимчив к вакууму космоса, более не скованный страхом перед ним.
  cost: 8
  removedComponents:
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.85
        Heat: 0.1
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Temperature

- type: damnation
  id: AllSeeing
  name: знание об окружении
  description: Подписант обретает способность видеть сквозь стены.
  cost: 6
  components:
    - type: ThermalVision
  reverseOnRemove: true

- type: damnation
  id: Magic
  name: тайные силы
  description: Подписант изучает несколько магических заклинаний перемещения.
  cost: 16
  components:
    - type: Jaunt
  reverseOnRemove: true

- type: damnation
  id: Health
  name: самоомоложение
  description: Подписант получает способность единожды полностью восстановить своё здоровье.
  cost: 10
  reverseOnRemove: true
  actions:
  - !type:DamnationActionAddAction
    actions:
    - ActionInstantRejuvenate

- type: damnation
  id: Power
  name: власть над другими
  description: Подписант получает броню и клинок, чтобы подчинять мир своей воле.
  cost: 6
  actions:
  - !type:DamnationActionSpawnLoot
    table: PowerDamnationRandomEquipment

- type: damnation
  id: Gun
  name: великий уравнитель
  description: Подписант получает оружие. Мы вложились в оружейные фьючерсы, и что-то пошло не так — нужно избавиться от этого хлама.
  cost: 10
  actions:
  - !type:DamnationActionSpawnLoot
    table: GunDamnationKit

- type: damnation
  id: Electricity
  name: иммунитет к электричеству
  description: Подписант становится... изолированным.
  cost: 4
  components:
  - type: Insulated

- type: damnation
  id: Noslip
  name: твёрдая поступь
  description: Подписант больше не поскальзывается.
  cost: 5
  components:
  - type: NoSlip

# TESTS (not intended for gameplay)

- type: damnation
  id: TestFail
  name: провал подписания
  description: Контракт никогда не сможет быть завершён.
  cost: -10
  actions:
  - !type:DamnationActionFail
