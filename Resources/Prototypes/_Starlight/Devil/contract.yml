- type: entity
  parent: [Paper, BaseMajorContraband]
  id: InfernalContract
  name: infernal contract
  description: The more you look at it, the more you feel like it is gazing back at you...
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/infernal_contract.rsi
      layers:
      - state: paper_words
        map: ["enum.PaperVisualLayers.Writing"]
        visible: true
      - state: paper_stamp-generic
        map: ["enum.PaperVisualLayers.Stamp"]
        visible: false
    - type: PaperVisuals
      backgroundImagePath: "/Textures/_Starlight/Interface/Paper/paper_background_dark.svg.96dpi.png"
      backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
      contentMargin: 16.0, 16.0, 16.0, 16.0
    - type: InfernalContract
    - type: ParsablePaper
      requiredPatterns:
      # 🌇Sunset🌇 - must have verbatim clause warning signator (kept in sync with the Russian
      # infernal-contract-base template in Locale/ru-RU/_Starlight/paper/infernal-contract.ftl)
      - "(?<=Я понимаю, что вернуть эти жертвы будет невозможно. Если я предлагаю свою душу, \\[bold\\]я понимаю, что после моей кончины моя душа падёт в пламя ада. Моё тело нельзя будет воскресить, клонировать или каким-либо иным способом вернуть к жизни.\\[/bold\\]).*"
      requestedValuePatterns:
        sacrifices: (?i)я предлагаю следующее:\s*((?:\n\s*[•\-\.\+]\s*.+)+)
        benefits: (?i)в обмен на:\s*((?:\n\s*[•\-\.\+]\s*.+)+)
