- type: ghostTheme
  id: Narsie
  name: Нарси
  description: Милый мужчина.
  spriteSpecifier:
    sprite:
      sprite: _Starlight/Mobs/Customization/GhostThemes/ghosts.rsi
      state: ghost-narsie
    color: "#ffffff"
  requirements:
  - !type:DiscordRolesRequirement
    requirement: MentorRolesReq

- type: ghostTheme
  id: Daemon
  name: Демон
  description: милый демон.
  spriteSpecifier:
    sprite:
      sprite: _Starlight/Mobs/Customization/GhostThemes/ghosts.rsi
      state: ghost-daemon
    color: "#ffffff"
  requirements:
  - !type:AnyRequirement
    requirements:
    - !type:DiscordRolesRequirement
      requirement: MentorRolesReq
    # 🌇Sunset🌇 - also unlockable via a manually-set admin rank (see AdminTitleRequirement's doc
    # comment) rather than only the Discord-role-synced mentor team.
    - !type:AdminTitleRequirement
      titles:
      - Host
      - Куратор
      - Ивент-мастер
      - Модератор
      - Ст.Модератор
      - Ментор
      - Мл.Ивент-мастер
      - Ст.Ивент-Мастер
