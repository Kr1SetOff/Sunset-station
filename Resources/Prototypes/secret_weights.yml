# Starlight - Alpha's Secret Pool
# 🌇Sunset🌇 - retuned for a 5-10 pop server: Nukeops/Revolutionary/Zombie/SubXenoborgs got their
# own GameRule.minPlayers lowered (see GameRules/roundstart.yml and _Starlight/GameRules/subgamemodes.yml)
# so they're now actually pickable at low pop instead of always failing SecretRuleSystem.CanPick;
# Xenoborgs (full)/CosmicCult/WizardDuel/TerrorSpiders stay intentionally rare/high-pop-only, per
# server owner's call, but SubXenoborgs is added as the low-pop-reachable counterpart to Xenoborgs.
- type: weightedRandom
  id: Secret
  weights:
    Traitor: 0.20 # SL
    Nukeops: 0.09 # SL
    Revolutionary: 0.09 # SL
    Zombie: 0.08 # SL
    Survival: 0.08 # SL
    CosmicCult: 0.07 # SL - kept rare, usually unreachable below 15 pop
    Vampire: 0.06 # SL
    Traitorling: 0.06 #SL
    SubXenoborgs: 0.06 # 🌇Sunset🌇 - low-pop-reachable xenoborgs, unlike the full mode below
    Xenoborgs: 0.03 #SL - kept rare, usually unreachable below 15 pop
    WizardDuel: 0.04 # SL + Moff Station - kept rare, usually unreachable below 35 pop
    ShitStation: 0.05 #SL
    TerrorSpiders: 0.04 # SL: kept very rare, usually unreachable below 50 pop
    Vamptraitorling: 0.03 #SL
    Zombieteors: 0.01 # SL
    KesslerSyndrome: 0.01 # SL
    AlmostAllAtOnce: 0.01 #SL

# Starlight - Beta's Secret Pool
# 🌇Sunset🌇 - the pool meant specifically for a small server; big-cast modes (TerrorSpiders,
# CosmicCult, WizardDuel) are kept in at a token weight for the rare population spike, but the bulk
# of the weight goes to what actually fires at 5-10 players.
- type: weightedRandom
  id: SecretLP
  weights:
    Traitor: 0.24
    Extended: 0.12
    Nukeops: 0.08
    SubXenoborgs: 0.08
    Survival: 0.08
    Revolutionary: 0.07
    Zombie: 0.07
    Vampire: 0.06
    CosmicCult: 0.05
    Traitorling: 0.05
    ShitStation: 0.05 #SL, ShitStation for Beta. Try it out, see if they find it fun. If they don't, easy to remove. I've heard a couple people say they wanted it, at least.
    TerrorSpiders: 0.02 # SL: kept very rare, usually unreachable below 50 pop
    WizardDuel: 0.02 # SL + Moff Station - kept rare, usually unreachable below 35 pop
    Vamptraitorling: 0.02 # SL, I was told to add it, so...
    Zombieteors: 0.01
    KesslerSyndrome: 0.01
